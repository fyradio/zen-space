/* Layout: full-bleed 3D night scene; title floats at the top, pose / view / robe controls dock at the bottom over the fog */
:root{
  --night:#0d1a1a; --ink:#ecf2e9; --dim:#94aaa3; --panel:rgba(9,18,19,.74); --line:#2b4644;
  --jade:#7fe3c6; --cinnabar:#e5483a; --lantern:#ffb35a;
  --f-title:'TPotta',serif; --f-ui:'WenKai','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 55%,transparent 55%,rgba(3,8,8,.75) 100%)}

.top{position:fixed;left:0;right:0;top:0;display:grid;justify-items:center;gap:6px;text-align:center;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(46px,13.5vw,78px);line-height:1.05;display:flex;align-items:center;gap:.04em;
  color:#eef6ea;text-shadow:0 0 18px rgba(127,227,198,.5),0 3px 0 #071010}
h1 span{display:inline-block;rotate:var(--r);animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.55s)}
h1 .zhan{color:var(--cinnabar);font-size:1.16em;position:relative;text-shadow:0 0 18px rgba(229,72,58,.55),0 3px 0 #2a0906}
h1 .zhan::after{content:"";position:absolute;left:-18%;right:-18%;top:50%;height:.055em;border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);rotate:-26deg;
  box-shadow:0 0 10px #fff,0 0 24px var(--jade);animation:slash 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.06em}}
@keyframes slash{0%,58%{clip-path:inset(0 100% 0 0);opacity:0}62%{opacity:1}70%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.sub{font-size:13px;letter-spacing:.32em;color:var(--dim);text-shadow:0 1px 4px #000}
.fonts{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.fonts small{font-size:11px;color:var(--dim);letter-spacing:.2em;margin-right:2px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;padding:6px 12px;min-height:32px;display:inline-flex;align-items:center;
  border-radius:999px;border:1px solid var(--line);background:rgba(9,18,19,.55);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(127,227,198,.1)}
.chip:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.dock{position:fixed;left:0;right:0;bottom:0;display:grid;gap:8px;justify-items:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{font-size:12px;color:var(--dim);letter-spacing:.2em;text-shadow:0 1px 4px #000;transition:opacity .6s}
.hint.gone{opacity:0}
.panel{width:100%;max-width:520px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  display:grid;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.v{grid-template-columns:repeat(3,1fr)}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:16px;min-height:44px;display:grid;place-items:center;
  border-radius:9px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.02);letter-spacing:.12em}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(127,227,198,.22),rgba(127,227,198,.06));border-color:var(--jade);color:#fff}
.seg.v button{font-size:14px;min-height:38px}
.row{display:flex;gap:10px;align-items:center}
.row .seg{flex:1;min-width:0}
.sws{display:flex;gap:8px;align-items:center}
.sw{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;box-sizing:border-box;border:2px solid var(--night);box-shadow:0 0 0 1px var(--line);position:relative}
.sw::after{content:"";position:absolute;inset:-7px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--jade)}
.lab{font-size:11px;color:var(--dim);letter-spacing:.2em;text-align:center}
/* 捏臉面板 */
.top{transition:opacity .3s}
.big{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:15px;min-height:40px;display:grid;place-items:center;padding:0 6px;
  border-radius:9px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.02);letter-spacing:.12em}
.big.go{border-color:var(--jade);background:linear-gradient(180deg,rgba(127,227,198,.26),rgba(127,227,198,.08));color:#fff}
.big:focus-visible,.ftabs button:focus-visible,.opts button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.sheet{display:none;width:100%;max-width:520px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;gap:8px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.editing .sheet{display:grid}
body.editing .panel.main,body.editing .hint{display:none}
body.editing .top{opacity:0;pointer-events:none}
.ftabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ftabs button{padding:0 2px!important;font-size:13px!important;letter-spacing:.04em!important}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button,.opts button{all:unset;box-sizing:border-box;flex:0 0 auto;cursor:pointer;padding:0 13px;min-height:36px;display:grid;place-items:center;border-radius:999px;
  border:1px solid var(--line);font-size:14px;letter-spacing:.1em;color:var(--ink);background:rgba(255,255,255,.02)}
.ftabs button[aria-pressed="true"],.opts button[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(127,227,198,.12)}
.fview{display:flex;gap:6px;align-items:center}
.fview .big{min-height:30px;font-size:13px;padding:0 12px}
.ftoast{margin-left:auto;font-size:12px;color:var(--jade);letter-spacing:.06em;text-align:right}
.flist{display:block;max-height:min(30vh,260px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.ctl{display:grid;grid-template-columns:7em 1fr 2.9em;align-items:center;gap:8px;min-height:42px;padding:2px 0}
.cl{all:unset;font-size:13px;color:var(--ink);cursor:pointer;letter-spacing:.04em;line-height:1.25}
.ctl input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--jade);touch-action:pan-y}
.cv{font-size:11px;color:var(--dim);text-align:right}
.cv.on{color:var(--jade)}
.opts{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.opts button{min-height:34px;padding:0 11px;font-size:13px}
.frow{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:6px}
.fio{display:grid;gap:6px}
.fio[hidden]{display:none}
.fio textarea{width:100%;box-sizing:border-box;height:58px;font:16px/1.3 var(--f-ui);background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;
  -webkit-user-select:text;user-select:text;resize:none}
.fio small{font-size:11px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){h1 span,h1 .zhan::after{animation:none}h1 .zhan::after{opacity:0}}
@media (max-height:620px){.fonts small{display:none}.sub{display:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#c');
const isTouch=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.75:2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const LC=c=>new THREE.Color(c).convertSRGBToLinear();

/* ---------- scene, fog, sky ---------- */
const FOGHEX=0x203735,FOG=LC(FOGHEX), FOGD=0.05;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(FOG.getHex(),FOGD);scene.fog.color.copy(FOG);
scene.background=FOG.clone();
const camera=new THREE.PerspectiveCamera(38,1,0.05,300);

const sky=new THREE.Mesh(new THREE.SphereGeometry(120,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:LC(0x060c15)},mid:{value:LC(0x10212a)},bot:{value:FOG.clone()}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 mid;uniform vec3 bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.1?mix(mid,top,smoothstep(0.1,0.75,h)):mix(bot,mid,smoothstep(-0.04,0.1,h));gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'
}));
sky.renderOrder=-10;scene.add(sky);

/* ---------- helpers ---------- */
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;t.encoding=THREE.sRGBEncoding;t.userData={c,x,draw};return t}
function redraw(t,draw){const {c,x}=t.userData;x.save();x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);draw(x,c.width,c.height);x.restore();t.needsUpdate=true}
const glowTex=ctex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.55)');g.addColorStop(.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)});
const grad=new THREE.DataTexture(new Uint8Array([110,110,110,255,182,182,182,255,255,255,255,255]),3,1,THREE.RGBAFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter;grad.generateMipmaps=false;grad.needsUpdate=true;
const gradSkin=new THREE.DataTexture(new Uint8Array([214,214,214,255,236,236,236,255,255,255,255,255]),3,1,THREE.RGBAFormat);
gradSkin.minFilter=gradSkin.magFilter=THREE.NearestFilter;gradSkin.generateMipmaps=false;gradSkin.needsUpdate=true;
const toon=(c,o={})=>{const r=Object.assign({roughness:.8,metalness:0},o);delete r.gradientMap;if(r.emissive!==undefined)r.emissive=LC(r.emissive);const m=new THREE.MeshStandardMaterial(r);m.color.copy(LC(c));return m};
const OUT=new THREE.ShaderMaterial({side:THREE.BackSide,
  uniforms:{w:{value:0.0055},col:{value:new THREE.Color(0x061010)},fc:{value:FOG},fd:{value:FOGD}},
  vertexShader:'uniform float w;varying float vD;void main(){vec4 mv=modelViewMatrix*vec4(position+normal*w,1.0);vD=-mv.z;gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform vec3 col;uniform vec3 fc;uniform float fd;varying float vD;void main(){float f=1.0-exp(-fd*fd*vD*vD);gl_FragColor=vec4(mix(col,fc,clamp(f,0.0,1.0)),1.0);}'});
function part(geo,mat,parent,o={}){const m=new THREE.Mesh(geo,mat);if(o.p)m.position.set(o.p[0],o.p[1],o.p[2]);if(o.r)m.rotation.set(o.r[0],o.r[1],o.r[2],o.ro||'XYZ');if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]);parent.add(m);if(o.ol===true)m.add(new THREE.Mesh(geo,OUT));return m}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0x9fbccb,0x6a4436,0.55);scene.add(hemi);
const keyL=new THREE.DirectionalLight(0xfff0e2,1.9);keyL.position.set(-4.5,5,3.5);scene.add(keyL);
const rimA=new THREE.DirectionalLight(0x7fe8d0,1.25);rimA.position.set(4,3,-5);scene.add(rimA);
const rimB=new THREE.DirectionalLight(0xa8c0ff,.8);rimB.position.set(-5,4,-4);scene.add(rimB);
const warmFill=new THREE.DirectionalLight(0xffc9a8,.35);warmFill.position.set(4,1.5,5);scene.add(warmFill);

/* ---------- ground & world ---------- */
const groundTex=ctex(512,512,(x,w,h)=>{x.fillStyle='#131c17';x.fillRect(0,0,w,h);
  for(let i=0;i<260;i++){const r=6+rnd()*40;x.fillStyle=`rgba(${rnd()<.5?'6,12,9':'40,52,38'},${.08+rnd()*.12})`;x.beginPath();x.arc(rnd()*w,rnd()*h,r,0,7);x.fill()}
  x.strokeStyle='rgba(70,92,62,.32)';x.lineWidth=1.4;for(let i=0;i<900;i++){const px=rnd()*w,py=rnd()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+(rnd()-.5)*5,py-3-rnd()*7);x.stroke()}});
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;groundTex.repeat.set(14,14);
const ground=new THREE.Mesh(new THREE.CircleGeometry(70,64),new THREE.MeshLambertMaterial({map:groundTex}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const stoneM=toon(0x58625f),stoneD=toon(0x3d4645),woodM=toon(0x1a2421),paperM=toon(0xd8d0b8);
function grave(x,z,rot,tilt){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.set(0,rot,tilt);scene.add(g);
  const w=.34+rnd()*.14,h=.45+rnd()*.25;part(new THREE.BoxGeometry(w,h,.1),stoneM,g,{p:[0,h/2,0]});
  part(new THREE.CylinderGeometry(w/2,w/2,.1,16,1,false,0,Math.PI),stoneM,g,{p:[0,h,0],r:[Math.PI/2,0,Math.PI/2]});
  part(new THREE.BoxGeometry(w+.12,.08,.22),stoneD,g,{p:[0,.04,0]});
  if(rnd()<.6)part(new THREE.PlaneGeometry(.07,.2),paperM,g,{p:[0,h*.55,.052],ol:false});}
function tree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);g.rotation.y=rnd()*6;scene.add(g);
  part(new THREE.CylinderGeometry(.07,.17,2.6,7),woodM,g,{p:[0,1.3,0]});
  for(let i=0;i<5;i++){const b=part(new THREE.CylinderGeometry(.02,.06,1.1+rnd()*.7,5),woodM,g,{p:[0,1.5+i*.3,0]});b.rotation.set(.6+rnd()*.5,i*1.3,0);b.translateY(.45)}}
for(let i=0;i<11;i++){const a=rnd()*Math.PI*2,r=5+rnd()*8;grave(Math.sin(a)*r,Math.cos(a)*r,rnd()*6,(rnd()-.5)*.25)}
for(let i=0;i<7;i++){const a=rnd()*Math.PI*2,r=8+rnd()*10;tree(Math.sin(a)*r,Math.cos(a)*r,.9+rnd()*.6)}

const moonTex=ctex(256,256,(x,w,h)=>{const g=x.createRadialGradient(128,128,40,128,128,128);g.addColorStop(0,'#f4f0dc');g.addColorStop(.62,'#e6e3cc');g.addColorStop(.66,'rgba(230,227,204,.0)');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(160,168,150,.25)';[[104,100,18],[150,140,12],[120,160,9],[160,96,7]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill()})});
const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex,fog:false,depthWrite:false}));moon.scale.set(9,9,1);moon.position.set(-26,24,-48);scene.add(moon);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x9fc4c8,opacity:.35,fog:false,depthWrite:false,blending:THREE.AdditiveBlending}));halo.scale.set(30,30,1);halo.position.copy(moon.position);scene.add(halo);

const fogTex=ctex(256,256,(x,w,h)=>{for(let i=0;i<40;i++){const px=40+rnd()*176,py=40+rnd()*176,r=30+rnd()*50;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(190,215,205,.18)');g.addColorStop(1,'rgba(190,215,205,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}});
const fogs=[];for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshBasicMaterial({map:fogTex,transparent:true,depthWrite:false,opacity:.24}));
  m.rotation.x=-Math.PI/2;m.position.set((rnd()-.5)*14,.04+i*.035,(rnd()-.5)*14);m.userData.s=(rnd()-.5)*.05;scene.add(m);fogs.push(m)}

const wisps=[];for(let i=0;i<16;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:i%4?0x6fffd2:0x9fd8ff,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  const a=rnd()*6.28,r=3.5+rnd()*9;s.position.set(Math.sin(a)*r,.5+rnd()*1.8,Math.cos(a)*r);s.userData={b:s.position.clone(),p:rnd()*9,k:.25+rnd()*.25};s.scale.setScalar(s.userData.k);scene.add(s);wisps.push(s)}

/* ---------- palettes ---------- */
const PALS=[
  {outer:'#82b3a8',inner:'#eef2ee',trim:'#2c675e',belt:'#26354a',ribbon:'#a3e6d2',cloud:'#5f948a'},
  {outer:'#2d313c',inner:'#e4ddcf',trim:'#a8352c',belt:'#121318',ribbon:'#c8463a',cloud:'#4b5161'},
  {outer:'#8f2c2c',inner:'#f2e6d2',trim:'#d9ad52',belt:'#1c1a1f',ribbon:'#e8c066',cloud:'#b4544a'}];
let pal=PALS[0];

/* ---------- procedural textures ---------- */
// soft cloth folds as a normal map (vertical folds along the garment)
const foldTex=(()=>{const W=256,H=256,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),im=x.createImageData(W,H);
  const hgt=(u,v)=>Math.sin(u*Math.PI*2*7+Math.sin(v*5.1)*.9)*.6+Math.sin(u*Math.PI*2*13+v*3.3+1.7)*.3+Math.sin(u*Math.PI*2*3-v*2)*.5;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const u=i/W,v=j/H,e=1/W;const dx=(hgt(u+e,v)-hgt(u-e,v))/(2*e)*.012;const dy=(hgt(u,v+e)-hgt(u,v-e))/(2*e)*.004;
    let nx=-dx,ny=-dy,nz=1;const l=Math.hypot(nx,ny,nz);const k=(j*W+i)*4;im.data[k]=(nx/l*.5+.5)*255;im.data[k+1]=(ny/l*.5+.5)*255;im.data[k+2]=(nz/l*.5+.5)*255;im.data[k+3]=255}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})();
const hairTex=ctex(128,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#141318');g.addColorStop(.5,'#1a1920');g.addColorStop(1,'#0f0e13');x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const px=rnd()*w;x.strokeStyle=rnd()<.5?'rgba(56,54,68,.38)':'rgba(6,6,10,.5)';x.lineWidth=.6+rnd()*1.6;x.beginPath();x.moveTo(px,0);x.bezierCurveTo(px+(rnd()-.5)*10,h*.3,px+(rnd()-.5)*12,h*.7,px+(rnd()-.5)*8,h);x.stroke()}
  const s=x.createLinearGradient(0,h*.12,0,h*.34);s.addColorStop(0,'rgba(130,150,175,0)');s.addColorStop(.5,'rgba(120,135,160,.16)');s.addColorStop(1,'rgba(130,150,175,0)');x.fillStyle=s;x.fillRect(0,h*.12,w,h*.22);
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,6,h);x.fillRect(w-6,0,6,h)});
function drawTorso(x,w,h){const cx=w*.5;x.fillStyle=pal.inner;x.fillRect(0,0,w,h);
  x.strokeStyle=pal.trim;x.lineCap='round';x.lineWidth=14;x.beginPath();x.moveTo(cx-30,-4);x.lineTo(cx-4,h*.32);x.stroke();
  x.lineWidth=16;x.beginPath();x.moveTo(cx+30,-6);x.quadraticCurveTo(cx-14,h*.34,cx-70,h*.66);x.stroke();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.moveTo(cx+22,-6);x.quadraticCurveTo(cx-21,h*.33,cx-76,h*.64);x.stroke();
  x.fillStyle=pal.trim;x.fillRect(0,0,w,h*.07)}
function drawSkirt(x,w,h){x.fillStyle=pal.inner;x.fillRect(0,0,w,h);x.fillStyle=pal.trim;x.fillRect(0,h*.965,w,h*.035)}
function drawCoat(x,w,h){x.fillStyle=pal.outer;x.fillRect(0,0,w,h);
  x.strokeStyle=pal.cloud;x.lineWidth=2.4;x.globalAlpha=.8;
  for(let i=0;i<10;i++){const px=i*w/10+30,py=h*.9;x.beginPath();x.arc(px,py,8,Math.PI*.2,Math.PI*1.8);x.stroke();x.beginPath();x.arc(px+14,py-5,6,Math.PI,Math.PI*2.6);x.stroke();x.beginPath();x.moveTo(px-9,py+7);x.quadraticCurveTo(px+9,py+14,px+27,py+3);x.stroke()}
  x.globalAlpha=1;
  // front edges and hem: trim band with a fine key-fret line
  const band=(x0,y0,bw,bh)=>{x.fillStyle=pal.trim;x.fillRect(x0,y0,bw,bh)};
  band(0,0,22,h);band(w-22,0,22,h);band(0,h*.955,w,h*.045);
  x.strokeStyle='rgba(255,236,190,.55)';x.lineWidth=1.2;
  for(const ex of [11,w-11]){x.beginPath();for(let y=0;y<h;y+=10){x.lineTo(ex-4,y);x.lineTo(ex-4,y+5);x.lineTo(ex+4,y+5);x.lineTo(ex+4,y+10)}x.stroke()}}
function drawBelt(x,w,h){x.fillStyle=pal.belt;x.fillRect(0,0,w,h);x.fillStyle='#c9a24e';x.fillRect(0,h*.18,w,2);x.fillRect(0,h*.78,w,2)}
const torsoTex=ctex(512,256,drawTorso),skirtTex=ctex(256,256,drawSkirt),coatTex=ctex(512,512,drawCoat),beltTex=ctex(256,32,drawBelt);

/* ---------- face parameters (捏臉): defaults are the current look; sliders edit F, 「複製設定」 exports it ---------- */
const IRIS=[['#2a1812','#5b3624','#8e6235','#3a2418','#1d120e'],['#0c0a0b','#1d1618','#33262a','#1b1315','#0b0809'],['#0e2a2a','#1f5a58','#3f9a8e','#18403c','#0b1c1c'],['#3a1f0a','#8a4f1c','#d49a3c','#5a3312','#2a1608'],['#1c1230','#3d2a6b','#7a62b8','#2a1d4a','#150e26']];
const LIP_STYLES=[{w:1,up:1,lo:1,bow:1,corner:0,gloss:1},{w:.74,up:1.1,lo:1.3,bow:1.4,corner:0,gloss:1.5},{w:1,up:1.3,lo:1.15,bow:1.9,corner:.6,gloss:1},
  {w:1.06,up:.9,lo:.95,bow:1,corner:3,gloss:.9},{w:1.06,up:.55,lo:.62,bow:.6,corner:0,gloss:.5},{w:.92,up:1,lo:1.05,bow:1.1,corner:0,gloss:1.2,bite:1}];
// 表情 平常/喜/怒/哀/樂/吶喊. Mouth (lip-local px): open = lower lip drop, w = width, corner = corner lift, lift = upper lip raise.
// Brows (texture px, + = down): bIn at the head of the brow, bOut at the tail. eo = eye opening; happy = closed ^ ^ eyes; furrow, tear.
const EXPRS=[{open:0,w:1,corner:0,lift:0,bIn:0,bOut:0,eo:1},
  {open:3,w:1.15,corner:6,lift:.5,bIn:-3,bOut:0,eo:.8},
  {open:2.5,w:.92,corner:-5,lift:.8,bIn:13,bOut:-5,eo:.78,furrow:1},
  {open:0,w:.86,corner:-5,lift:0,bIn:-12,bOut:6,eo:.86,tear:1},

  {open:15,w:1.3,corner:-1.5,lift:2.5,bIn:9,bOut:-4,eo:1.12,furrow:1}];
let exprForce=null;// 施法 forces 吶喊 without touching the saved setting
const LIPS=[['#cf8a80','#df9f95'],['#d9a49c','#e7b8af'],['#b5584f','#c77067'],['#d49b8c','#e0b0a2']];

// t: s=只改頭部縮放, g=頭型幾何, x=臉部貼圖（g/x 可併用）
const FACE_SPEC=[
 {tab:'臉型',items:[
  {k:'headH',n:'頭高（短↔長）',min:0.765,max:1.005,step:.005,span:0.24,def:0.885,t:'s'},
  {k:'headS',n:'頭大小',min:0.925,max:1.225,step:.005,span:0.3,def:1.075,t:'s'},
  {k:'faceW',n:'臉寬',min:0.52,max:0.82,step:.005,span:0.3,def:0.67,t:'s'},
  {k:'foreW',n:'額頭寬',min:0.02,max:0.14,step:.005,span:0.12,def:0.08,t:'g'},
  {k:'cheekW',n:'顴骨寬',min:-0.005,max:0.395,step:.005,span:0.4,def:0.195,t:'g'},

  // camera
  if((mode==='fly'||mode==='walk')&&clock-lastDrag>2.5){want.yaw=angLerp(want.yaw,root.rotation.y+Math.PI+(mode==='fly'?.75:1.15),1-Math.exp(-dt*.9))}
  const kc=1-Math.exp(-dt*7);cam.yaw=angLerp(cam.yaw,want.yaw,kc);cam.pitch=lerp(cam.pitch,want.pitch,kc);cam.d=lerp(cam.d,want.d,kc);cam.ty=lerp(cam.ty,want.ty,kc);cam.sh=lerp(cam.sh,want.sh,kc);
  if(cam.sh>.003){const W=innerWidth,H=innerHeight;camera.setViewOffset(W,H,0,Math.round(H*cam.sh),W,H)}else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
  camT.lerp(tmp.set(HERO.pos.x,HERO.pos.y+cam.ty,HERO.pos.z),1-Math.exp(-dt*6));
  const cd=cam.d+swordVis*(view==='game'?0:1.1);
  camera.position.set(camT.x+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cd,camT.y+Math.sin(cam.pitch)*cd,camT.z+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cd);
  if(camera.position.y<.15)camera.position.y=.15;
  camera.lookAt(camT);sky.position.copy(camera.position);
  renderer.render(scene,camera)}
setView('full');requestAnimationFrame(t=>{last=t;frame(t)});
/* ---------- 身形: heights are remapped (legs below the belt, torso belt→shoulder, the rest shifted), widths scaled below the neck ---------- */
function bodyY0(y){const L=F.legLen,T=F.torsoLen,BELT=K;return y<=BELT?y*L:y<=SH?BELT*L+(y-BELT)*T:BELT*L+(SH-BELT)*T+(y-SH)}
function bodyY(y){return bodyY0(y)+(y>SH+.02?neckDy():0)}// clothes use bodyY0 so the collar stays put
function neckDy(){return (F.neckLen-1)*.09}// 脖子長: lifts everything above the collar
const bodyKids=body.children.map(o=>({o,p:o.position.clone(),s:o.scale.clone()}));
const torso0=torsoGeo.attributes.position.array.slice();
function bodyX(y){return F.bodyW*(1+(F.shoulderW-1)*Math.min(1,Math.max(0,(y-1.15*K)/(.23*K))))}
const smb=(a,b,v)=>{const t=Math.min(1,Math.max(0,(v-a)/(b-a)));return t*t*(3-2*t)};
const slope=(x,y)=>-.05*F.shoulderDrop*smb(.05,.17,Math.abs(x))*smb(1.28*K,1.42*K,y);// 溜肩: lower the outer shoulder line
function remapLathe(src,dst){for(let i=0;i<src.length;i+=3){const x=src[i],y=src[i+1];dst[i]=x*bodyX(y);dst[i+1]=bodyY0(y)+slope(x,y);dst[i+2]=src[i+2]*F.bodyW}}
function scaleRopes(){const hw=F.height*F.headS*F.faceW;
  for(const r of ropes){if(!r.kind)continue;const b=r.base,w=r.kind==='hair'?hw:F.height;r.seg=b.seg*.75*F.height;r.w0=b.w0*w;r.w1=b.w1*w}}
function applyBody(){
  body.scale.setScalar(F.height);scaleRopes();
  remapLathe(skirt0,skirtBase);remapLathe(coat0,coatBase);
  const ta=torsoGeo.attributes.position;remapLathe(torso0,ta.array);ta.needsUpdate=true;torsoGeo.computeVertexNormals();torsoGeo.computeBoundingSphere();
  skirtGeo.computeBoundingSphere();coatGeo.computeBoundingSphere();
  for(const {o,p,s:sc} of bodyKids){
    if(o===torso||o.geometry===skirtGeo||o.geometry===coatGeo)continue;
    o.position.y=bodyY(p.y);
    if(o===armL.sh||o===armR.sh){o.position.x=p.x*bodyX(p.y);o.position.y+=-.03*F.shoulderDrop;o.scale.setScalar(F.armLen);continue}
    if(pads.includes(o)){o.position.x=p.x*bodyX(p.y);o.position.y+=-.035*F.shoulderDrop;o.scale.set(sc.x*F.bodyW,sc.y*(1-.3*F.shoulderDrop),sc.z*F.bodyW);continue}
    if(o===neck){const h=.13+neckDy();o.scale.y=sc.y*h/.13;o.position.y=bodyY0(SH)+.02+h/2;continue}
    if(o===headG||p.y>SH+.04)continue;// head and neck keep their size
    const w=p.y>1.15*K?bodyX(p.y):F.bodyW;
    o.position.x=p.x*w;o.position.z=p.z*F.bodyW;o.scale.set(sc.x*w,sc.y,sc.z*F.bodyW)}
  if(document.body.classList.contains('editing'))editCam();else want.ty=viewTy(view)}
/* ---------- 捏臉面板 ---------- */
function applyFace(dirty){
  headG.scale.set(F.headS*F.faceW,F.headS*F.headH,F.headS);scaleRopes();
  if(dirty.g)shapeHead();
  if(dirty.x){redraw(faceTex,drawFace);M.skin.color.copy(LC(SKINS[F.skin][0])).multiplyScalar(.93)}}
const saveFace=()=>{try{localStorage.setItem(FACE_KEY,JSON.stringify({h:FACE_HASH,f:F}))}catch(e){}};
let fdirty={g:0,x:0,b:0},ftimer=0;
function faceChanged(it){
  if(it.t.includes('g'))fdirty.g=1;if(it.t.includes('x'))fdirty.x=1;if(it.t.includes('b'))fdirty.b=1;
  if(!ftimer)ftimer=setTimeout(()=>{ftimer=0;const d=fdirty;fdirty={g:0,x:0,b:0};applyFace(d);if(d.b)applyBody();saveFace()},50)}
M.skin.color.copy(LC(SKINS[F.skin][0])).multiplyScalar(.93);// same tone as the face texture so the neck matches
let curTab=0,ftoastT=0;
applyBody();
const ftoast=m=>{const e=$('#ftoast');e.textContent=m;clearTimeout(ftoastT);ftoastT=setTimeout(()=>{e.textContent=''},3200)};
function renderTabs(){const box=$('#ftabs');box.innerHTML='';
  FACE_SPEC.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.tab;b.setAttribute('aria-pressed',String(i===curTab));
    b.onclick=()=>{curTab=i;renderTabs();renderList();editCam()};box.appendChild(b)})}
// 身形 tab frames the whole figure above the sheet; other tabs frame the face
function editCam(){if(FACE_SPEC[curTab].cam==='body'){const tot=(bodyY(HY)+.15)*F.height;want.d=tot*2.9;want.pitch=.08;want.ty=tot*.54}else{want.d=VIEWS.edit.d*F.height;want.pitch=VIEWS.edit.p;want.ty=viewTy('edit')}}
function renderList(){const box=$('#flist');box.innerHTML='';box.scrollTop=0;
  FACE_SPEC[curTab].items.forEach(it=>{
    const row=document.createElement('div');row.className='ctl';
    const lab=document.createElement('button');lab.className='cl';lab.textContent=it.n;lab.title='點一下還原預設';
    lab.onclick=()=>{F[it.k]=it.def;faceChanged(it);renderList()};row.appendChild(lab);
    if(it.opts){const seg=document.createElement('div');seg.className='opts';
      it.opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.setAttribute('aria-pressed',String(F[it.k]===i));
        b.onclick=()=>{F[it.k]=i;faceChanged(it);[...seg.children].forEach((c,j)=>c.setAttribute('aria-pressed',String(j===i)))};seg.appendChild(b)});
      row.appendChild(seg)}
    else{const inp=document.createElement('input');inp.type='range';inp.min=it.min;inp.max=it.max;inp.step=it.step;inp.value=F[it.k];inp.setAttribute('aria-label',it.n);
      const val=document.createElement('span');val.className='cv';
      const show=()=>{const n=Math.round((F[it.k]-it.def)/it.step);val.textContent=n?(n>0?'+':'')+n:'預設';val.classList.toggle('on',!!n)};show();
      inp.oninput=()=>{F[it.k]=+inp.value;show();faceChanged(it)};row.append(inp,val)}
    box.appendChild(row)})}
const packFace=()=>{const o={};FACE_SPEC.forEach(s=>s.items.forEach(i=>{o[i.k]=+(+F[i.k]).toFixed(3)}));return '午夜來斬妖・捏臉設定 '+JSON.stringify(o)};
function unpackFace(txt){const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)return 0;let o;try{o=JSON.parse(txt.slice(a,b+1))}catch(e){return 0}
  let n=0;FACE_SPEC.forEach(s=>s.items.forEach(i=>{const v=o[i.k];if(typeof v==='number'&&isFinite(v)){
    F[i.k]=i.opts?Math.max(0,Math.min(i.opts.length-1,Math.round(v))):Math.max(i.min,Math.min(i.max,v));n++}}));return n}
const applyAllFace=()=>{applyFace({g:1,x:1});applyBody();saveFace();renderList()};
function showIO(hint,text){const io=$('#fio');io.hidden=false;$('#fiohint').textContent=hint;const ta=$('#fiota');ta.value=text||'';ta.focus();if(text){ta.select();try{ta.setSelectionRange(0,text.length)}catch(e){}}}
$('#fcopy').onclick=async()=>{const t=packFace();
  try{await navigator.clipboard.writeText(t);ftoast('已複製！貼給 Claude 就能設成預設');$('#fio').hidden=true;return}catch(e){}
  showIO('這裡不能自動複製：請長按文字框「全選」再「拷貝」',t);
  try{if(document.execCommand('copy')){ftoast('已複製！貼給 Claude 就能設成預設');$('#fio').hidden=true}}catch(e){}};
$('#fpaste').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();if(unpackFace(t)){applyAllFace();ftoast('已套用貼上的設定');return}}catch(e){}
  showIO('把之前複製的設定文字貼進來，再按「套用」','')};
$('#fapply').onclick=()=>{if(unpackFace($('#fiota').value)){applyAllFace();ftoast('已套用');$('#fio').hidden=true}else $('#fiohint').textContent='看不懂這段文字，請確認是完整的「捏臉設定」'};
$('#fioclose').onclick=()=>{$('#fio').hidden=true};
$('#freset').onclick=()=>{Object.assign(F,FACE_DEF);applyAllFace();ftoast('已還原預設')};
let editPrev=null;
function openEdit(){editPrev={view,mode};document.body.classList.add('editing');setMode('idle');setView('edit');want.sh=.26;want.yaw=0;renderTabs();renderList();editCam()}
function closeEdit(){document.body.classList.remove('editing');$('#fio').hidden=true;if(editPrev){setMode(editPrev.mode);setView(VIEWS[editPrev.view]?editPrev.view:'full')}want.sh=0;editPrev=null}
$('#fedit').onclick=openEdit;$('#fdone').onclick=closeEdit;
$$('[data-fyaw]').forEach(b=>b.addEventListener('click',()=>{want.yaw=+b.dataset.fyaw}));
window.__hero={setMode,setView,applyPal,setYaw:y=>{want.yaw=y},openEdit,closeEdit,F,applyAllFace,setTab:i=>{curTab=i;renderTabs();renderList();editCam()}};
})();
</script>
