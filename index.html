/* Layout: full-bleed 3D night scene; title floats at the top, pose / view / robe controls dock at the bottom over the fog */
:root{
  --night:#0d1a1a; --ink:#ecf2e9; --dim:#94aaa3; --panel:rgba(9,18,19,.74); --line:#2b4644;
  --jade:#7fe3c6; --cinnabar:#e5483a; --lantern:#ffb35a;
  --f-title:'TPotta',serif; --f-ui:'WenKai','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 55%,transparent 55%,rgba(3,8,8,.75) 100%)}

.top{position:fixed;left:0;right:0;top:0;display:grid;justify-items:center;gap:6px;text-align:center;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(46px,13.5vw,78px);line-height:1.05;display:flex;align-items:center;gap:.04em;
  color:#eef6ea;text-shadow:0 0 18px rgba(127,227,198,.5),0 3px 0 #071010}
h1 span{display:inline-block;rotate:var(--r);animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.55s)}
h1 .zhan{color:var(--cinnabar);font-size:1.16em;position:relative;text-shadow:0 0 18px rgba(229,72,58,.55),0 3px 0 #2a0906}
h1 .zhan::after{content:"";position:absolute;left:-18%;right:-18%;top:50%;height:.055em;border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);rotate:-26deg;
  box-shadow:0 0 10px #fff,0 0 24px var(--jade);animation:slash 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -.06em}}
@keyframes slash{0%,58%{clip-path:inset(0 100% 0 0);opacity:0}62%{opacity:1}70%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.sub{font-size:13px;letter-spacing:.32em;color:var(--dim);text-shadow:0 1px 4px #000}
.fonts{display:flex;gap:6px;align-items:center;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.fonts small{font-size:11px;color:var(--dim);letter-spacing:.2em;margin-right:2px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;padding:6px 12px;min-height:32px;display:inline-flex;align-items:center;
  border-radius:999px;border:1px solid var(--line);background:rgba(9,18,19,.55);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(127,227,198,.1)}
.chip:focus-visible,.seg button:focus-visible,.sw:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.dock{position:fixed;left:0;right:0;bottom:0;display:grid;gap:8px;justify-items:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{font-size:12px;color:var(--dim);letter-spacing:.2em;text-shadow:0 1px 4px #000;transition:opacity .6s}
.hint.gone{opacity:0}
.panel{width:100%;max-width:520px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  display:grid;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg.v{grid-template-columns:repeat(3,1fr)}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:16px;min-height:44px;display:grid;place-items:center;
  border-radius:9px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.02);letter-spacing:.12em}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(127,227,198,.22),rgba(127,227,198,.06));border-color:var(--jade);color:#fff}
.seg.v button{font-size:14px;min-height:38px}
.row{display:flex;gap:10px;align-items:center}
.row .seg{flex:1;min-width:0}
.sws{display:flex;gap:8px;align-items:center}
.sw{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;box-sizing:border-box;border:2px solid var(--night);box-shadow:0 0 0 1px var(--line);position:relative}
.sw::after{content:"";position:absolute;inset:-7px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--jade)}
.lab{font-size:11px;color:var(--dim);letter-spacing:.2em;text-align:center}
@media (prefers-reduced-motion:reduce){h1 span,h1 .zhan::after{animation:none}h1 .zhan::after{opacity:0}}
@media (max-height:620px){.fonts small{display:none}.sub{display:none}}
</style>

<canvas id="c" aria-label="午夜來斬妖主角的 3D 模型，可拖曳旋轉"></canvas>
<div class="vig"></div>

<header class="top">
  <h1 id="title" aria-label="午夜來斬妖">
    <span style="--r:-5deg;--i:0">午</span><span style="--r:3deg;--i:1">夜</span><span style="--r:-2deg;--i:2">來</span><span class="zhan" style="--r:6deg;--i:3">斬</span><span style="--r:-4deg;--i:4">妖</span>
  </h1>
  <div class="sub">煉氣一層・小道士　主角試做 v0.4</div>
  <div class="fonts" role="group" aria-label="標題字體">
    <small>標題字體</small>
    <button class="chip" data-font="TPotta" aria-pressed="true">墨團</button>
    <button class="chip" data-font="TReggae" aria-pressed="false">怪奇</button>
    <button class="chip" data-font="TRampart" aria-pressed="false">立體</button>
    <button class="chip" data-font="TBoku" aria-pressed="false">毛筆</button>
  </div>
</header>

<div class="dock">
  <div class="hint" id="hint">拖曳旋轉・雙指縮放</div>
  <div class="panel">
    <div class="seg" role="group" aria-label="動作">
      <button data-mode="idle" aria-pressed="true">負手</button>
      <button data-mode="walk" aria-pressed="false">行走</button>
      <button data-mode="cast" aria-pressed="false">施法</button>
      <button data-mode="fly" aria-pressed="false">御劍</button>
    </div>
    <div class="row">
      <div class="seg v" role="group" aria-label="鏡頭">
        <button data-view="face" aria-pressed="false">特寫</button>

        <button data-view="game" aria-pressed="false">遊戲視角</button>
      </div>
      <div class="sws" role="group" aria-label="道袍顏色">
        <button class="sw" data-pal="0" aria-pressed="true" aria-label="月白青衫" style="background:linear-gradient(135deg,#e3ebee 50%,#1f6763 50%)"></button>
        <button class="sw" data-pal="1" aria-pressed="false" aria-label="玄墨朱紋" style="background:linear-gradient(135deg,#2c303b 50%,#a8352c 50%)"></button>
        <button class="sw" data-pal="2" aria-pressed="false" aria-label="絳紅金邊" style="background:linear-gradient(135deg,#8f2c2c 50%,#d9ad52 50%)"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#c');
const isTouch=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.75:2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const LC=c=>new THREE.Color(c).convertSRGBToLinear();

/* ---------- scene, fog, sky ---------- */
const FOGHEX=0x203735,FOG=LC(FOGHEX), FOGD=0.05;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(FOG.getHex(),FOGD);scene.fog.color.copy(FOG);
scene.background=FOG.clone();
const camera=new THREE.PerspectiveCamera(38,1,0.05,300);

const sky=new THREE.Mesh(new THREE.SphereGeometry(120,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:LC(0x060c15)},mid:{value:LC(0x10212a)},bot:{value:FOG.clone()}},
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 top;uniform vec3 mid;uniform vec3 bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.1?mix(mid,top,smoothstep(0.1,0.75,h)):mix(bot,mid,smoothstep(-0.04,0.1,h));gl_FragColor=vec4(c,1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'
}));

    const uv=[];for(let r=0;r<rows;r++)for(let c=0;c<this.C;c++)uv.push(c/(this.C-1)*.5,1-r/(rows-1)*.5);g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    this.geo=g;this.mesh=new THREE.Mesh(g,mat);this.mesh.frustumCulled=false;scene.add(this.mesh);this.ok=false;this.ph=rnd()*9}
  step(dt,t,wind){const C=this.C,R=this.R,p=this.p,q=this.q,dt2=dt*dt;
    const top=this.pins.map(o=>o.getWorldPosition(new THREE.Vector3()));

    for(let c=0;c<C;c++){p[c].copy(top[c]);q[c].copy(top[c])}
    for(let i=C;i<C*R;i++){const P=p[i],Q=q[i],k=Math.floor(i/C)/(R-1);const vx=(P.x-Q.x)*.94,vy=(P.y-Q.y)*.94,vz=(P.z-Q.z)*.94;Q.copy(P);
      const f=Math.sin(t*2.7+this.ph+i*.4)*.5*k;
      P.x+=vx+(wind.x*.8+HERO.right.x*f)*dt2;P.y+=vy+(-7+wind.y)*dt2;P.z+=vz+(wind.z*.8+HERO.right.z*f)*dt2}
    for(let it=0;it<4;it++){
      for(let r=1;r<R;r++)for(let c=0;c<C;c++){this.cons(p[(r-1)*C+c],p[r*C+c],this.sp,r===1)}
      for(let r=1;r<R;r++){const fl=1+.5*r/(R-1);for(let c=0;c<C-1;c++){const rest=top[c].distanceTo(top[c+1])*fl;this.cons(p[r*C+c],p[r*C+c+1],rest,false)}}
      for(let i=C;i<C*R;i++)pushOut(p[i])}}
  cons(A,B,rest,pinA){tmp.subVectors(B,A);const d=tmp.length()||1e-6,diff=(d-rest)/d;
    if(pinA)B.addScaledVector(tmp,-diff);else{A.addScaledVector(tmp,diff*.5);B.addScaledVector(tmp,-diff*.5)}}
  build(){const pa=this.pa;this.p.forEach((v,i)=>{pa[i*3]=v.x;pa[i*3+1]=v.y;pa[i*3+2]=v.z});this.geo.attributes.position.needsUpdate=true;this.geo.computeVertexNormals();this.geo.computeBoundingSphere()}}

/* ---------- light trails ---------- */
class Trail{constructor(n,w,color){this.n=n;this.w=w;this.pts=[];const g=new THREE.BufferGeometry();this.pa=new Float32Array(n*6);this.al=new Float32Array(n*2);
    g.setAttribute('position',new THREE.BufferAttribute(this.pa,3));g.setAttribute('al',new THREE.BufferAttribute(this.al,1));
    const idx=[];for(let i=0;i<n-1;i++){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}g.setIndex(idx);this.geo=g;
    this.mesh=new THREE.Mesh(g,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,uniforms:{col:{value:new THREE.Color(color)},op:{value:1}},
      vertexShader:'attribute float al;varying float vA;void main(){vA=al;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader:'uniform vec3 col;uniform float op;varying float vA;void main(){gl_FragColor=vec4(col,vA*op);}'}));
    this.mesh.frustumCulled=false;scene.add(this.mesh)}
  push(v){this.pts.unshift(v.clone());if(this.pts.length>this.n)this.pts.pop()}
  build(op){const p=this.pts,n=this.n;this.mesh.material.uniforms.op.value=op;this.mesh.visible=op>.01&&p.length>1;if(!this.mesh.visible)return;
    for(let i=0;i<n;i++){const a=p[Math.min(i,p.length-1)],b=p[Math.min(i+1,p.length-1)],c=p[Math.max(0,i-1)];
      tmp.subVectors(c,b);if(tmp.lengthSq()<1e-8)tmp.set(0,0,1);tmp.normalize();tmp2.subVectors(camera.position,a).normalize();tmp3.crossVectors(tmp,tmp2).normalize();
      const w=this.w*(1-i/n)*.5;this.pa.set([a.x-tmp3.x*w,a.y-tmp3.y*w,a.z-tmp3.z*w,a.x+tmp3.x*w,a.y+tmp3.y*w,a.z+tmp3.z*w],i*6);
      const al=Math.pow(1-i/n,1.6)*(i<p.length?1:0);this.al[i*2]=al;this.al[i*2+1]=al}
    this.geo.attributes.position.needsUpdate=true;this.geo.attributes.al.needsUpdate=true}}
const flyTrail=new Trail(34,.16,0x8fffe0);
const orbitTrails=orbit.map(()=>new Trail(16,.035,0x8fffe0));

/* ---------- poses ---------- */
const POSES={
  idle:{aLx:.42,aLz:-.12,fLx:.25,fLz:-1.5,aRx:-.05,aRz:-.12,fRx:-.25,lean:0,fing:0,bootS:0},
  walk:{aLx:0,aLz:.1,fLx:-.2,fLz:0,aRx:0,aRz:-.1,fRx:-.2,lean:.04,fing:0,bootS:0},
  cast:{aLx:.42,aLz:-.12,fLx:.25,fLz:-1.5,aRx:-1.38,aRz:.16,fRx:-.3,lean:.04,fing:1,bootS:.08},
  fly:{aLx:.42,aLz:-.12,fLx:.25,fLz:-1.5,aRx:-1.12,aRz:.1,fRx:-.45,lean:.2,fing:1,bootS:.13}};
const pose=Object.assign({},POSES.idle);
let mode='idle',walkPh=0,pathA=0,swordVis=0,castVis=0;
const lerp=(a,b,k)=>a+(b-a)*k;
const angLerp=(a,b,k)=>{let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*k};

/* ---------- camera control ---------- */
const VIEWS={face:{d:1.15,p:.08,ty:1.4},full:{d:3.3,p:.15,ty:.88},game:{d:9.5,p:.95,ty:.6}};
let view='full';const cam={yaw:.35,pitch:.15,d:3.3,ty:.88},want={yaw:.35,pitch:.15,d:3.3,ty:.88};
const camT=new THREE.Vector3(0,1,0);let lastDrag=-99;const ptrs=new Map();let pinch0=0,pinchD=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);pinchD=want.d}});
canvas.addEventListener('pointermove',e=>{const pr=ptrs.get(e.pointerId);if(!pr)return;const dx=e.clientX-pr.x,dy=e.clientY-pr.y;pr.x=e.clientX;pr.y=e.clientY;
  if(ptrs.size===1){want.yaw-=dx*.0085;want.pitch=Math.max(-.05,Math.min(1.3,want.pitch+dy*.006));lastDrag=clock;hideHint()}
  else if(ptrs.size===2&&pinch0>0){const [a,b]=[...ptrs.values()];want.d=Math.max(.9,Math.min(16,pinchD*pinch0/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));lastDrag=clock;hideHint()}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();want.d=Math.max(.9,Math.min(16,want.d*(1+e.deltaY*.0012)));hideHint()},{passive:false});
function hideHint(){$('#hint').classList.add('gone')}
function setView(v){view=v;const V0=VIEWS[v];want.d=V0.d;want.pitch=V0.p;want.ty=V0.ty;$$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)))}
function setMode(m){mode=m;$$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));lastDrag=-99}
$$('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$$('[data-pal]').forEach(b=>b.addEventListener('click',()=>{applyPal(+b.dataset.pal);$$('[data-pal]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));

/* ---------- resize ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<.75?44:36;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- main loop ---------- */
let clock=0,last=performance.now(),acc=0;const STEP=1/60;
const prevPos=new THREE.Vector3(),wind=new THREE.Vector3(),sway={x:0,z:0,lift:0};
const target=new THREE.Vector3();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  // root motion per mode
  let tYaw=0;
  if(mode==='walk'){pathA+=dt*.42;const R=2.2;target.set(Math.sin(pathA)*R,0,Math.cos(pathA)*R);tYaw=Math.atan2(Math.cos(pathA),-Math.sin(pathA));walkPh+=dt*5.4}
  else if(mode==='fly'){pathA+=dt*.55;const R=3.4;target.set(Math.sin(pathA)*R,1.25+Math.sin(clock*1.3)*.08,Math.cos(pathA)*R);tYaw=Math.atan2(Math.cos(pathA),-Math.sin(pathA))}
  else{target.set(0,0,0);tYaw=0;walkPh=lerp(walkPh,Math.round(walkPh/Math.PI)*Math.PI,1-Math.exp(-dt*6))}
  const kk=1-Math.exp(-dt*(mode==='walk'||mode==='fly'?3.2:2.4));
  root.position.lerp(target,kk);root.rotation.y=angLerp(root.rotation.y,tYaw,1-Math.exp(-dt*4));
  root.updateMatrixWorld();
  HERO.pos.copy(root.position);HERO.right.set(Math.cos(root.rotation.y),0,-Math.sin(root.rotation.y));HERO.fwd.set(Math.sin(root.rotation.y),0,Math.cos(root.rotation.y));
  HERO.vel.subVectors(root.position,prevPos).divideScalar(Math.max(dt,1e-3));prevPos.copy(root.position);
  // pose blend
  const P0=POSES[mode],kp=1-Math.exp(-dt*6);for(const k in P0)pose[k]=lerp(pose[k],P0[k],kp);
  const sw=mode==='walk'?Math.sin(walkPh):0;
  armL.sh.rotation.set(pose.aLx+.36*sw,0,pose.aLz);armL.el.rotation.set(pose.fLx,0,pose.fLz);
  armR.sh.rotation.set(pose.aRx-.36*sw,0,pose.aRz);armR.el.rotation.set(pose.fRx,0,0);
  armR.fing.scale.y=Math.max(.001,pose.fing);armL.fing.scale.y=.001;
  bootL.position.z=.03+.13*sw+pose.bootS;bootR.position.z=.03-.13*sw-pose.bootS;
  const breath=Math.sin(clock*1.6);
  body.position.y=(mode==='walk'?Math.abs(Math.cos(walkPh))*.022:0)+breath*.003;
  body.rotation.x=pose.lean;
  const lx=HERO.vel.dot(HERO.right),lz=HERO.vel.dot(HERO.fwd);
  const toC=tmp.copy(root.position).negate().setY(0).normalize();
  body.rotation.z=lerp(body.rotation.z,mode==='fly'?-.2*toC.dot(HERO.right):mode==='walk'?.03*sw:0,1-Math.exp(-dt*3));
  headG.rotation.y=Math.sin(clock*.5)*.12*(mode==='idle'?1:.3);headG.rotation.x=mode==='fly'?-.18:Math.sin(clock*.7)*.03;
  torso.scale.set(1+breath*.006,1,1+breath*.008);
  // skirt sway
  const fl=mode==='fly'?1:0;
  sway.x=lerp(sway.x,-lx*.05+(mode==='walk'?.025*Math.sin(walkPh*2):.012*Math.sin(clock*1.2)),1-Math.exp(-dt*5));
  sway.z=lerp(sway.z,-lz*.05-fl*.16+(mode==='walk'?.02*Math.abs(sw):0),1-Math.exp(-dt*5));
  sway.lift=lerp(sway.lift,fl*.05,1-Math.exp(-dt*3));
  {const a=skirtGeo.attributes.position.array;for(let i=0;i<a.length;i+=3){const by=skirtBase[i+1];const f=Math.pow(Math.max(0,(1.03*K-by)/K),1.6);
     const fr=fl*Math.sin(clock*9+skirtBase[i]*20)*.012*f;a[i]=skirtBase[i]+sway.x*f;a[i+1]=by+sway.lift*f+fr;a[i+2]=skirtBase[i+2]+sway.z*f}
   skirtGeo.attributes.position.needsUpdate=true;
   const c=coatGeo.attributes.position.array;for(let i=0;i<c.length;i+=3){const by=coatBase[i+1];const f=Math.pow(Math.max(0,(1.03*K-by)/K),1.5);
     const fr=fl*Math.sin(clock*9+coatBase[i]*18+1)*.016*f;c[i]=coatBase[i]+sway.x*f*1.15;c[i+1]=by+sway.lift*f*1.2+fr;c[i+2]=coatBase[i+2]+sway.z*f*1.15}
   coatGeo.attributes.position.needsUpdate=true}
  // props
  swordVis=lerp(swordVis,mode==='fly'?1:0,1-Math.exp(-dt*5));flySword.scale.setScalar(Math.max(.001,swordVis));flySword.position.y=-.015;
  castVis=lerp(castVis,mode==='cast'?1:0,1-Math.exp(-dt*5));
  scene.updateMatrixWorld();
  // lantern follows over the right shoulder
  const lt=tmp2.copy(HERO.pos).addScaledVector(HERO.right,-.5).addScaledVector(HERO.fwd,.15);lt.y=HERO.pos.y+1.68+Math.sin(clock*1.7)*.06;
  lantern.position.lerp(lt,1-Math.exp(-dt*(mode==='fly'?4:2.2)));lantern.rotation.z=Math.sin(clock*1.3)*.08;lantern.rotation.y+=dt*.4;
  lanternL.intensity=1.5+Math.sin(clock*7.3)*.1+Math.sin(clock*13.1)*.06;
  // orbit swords
  const oc=tmp.copy(HERO.pos).addScaledVector(V(0,1,0),1.08);
  orbit.forEach((g,i)=>{g.visible=castVis>.02;const a=clock*2.4+i*Math.PI*2/3;const r=.72*castVis;
    g.position.set(oc.x+Math.cos(a)*r,oc.y+Math.sin(a*2)*.08,oc.z+Math.sin(a)*r);g.lookAt(oc.x+Math.cos(a+.3)*r,g.position.y,oc.z+Math.sin(a+.3)*r);g.scale.setScalar(Math.max(.001,castVis));
    g.updateMatrixWorld();orbitTrails[i].push(g.localToWorld(tmp3.set(0,0,-.2)));orbitTrails[i].build(castVis*.9)});
  castLight.position.copy(oc);castLight.intensity=castVis*(1.2+Math.sin(clock*9)*.2);
  flyTrail.push(A.flyTail.getWorldPosition(tmp3));flyTrail.build(swordVis*.85);
  // soft bodies
  wind.copy(HERO.vel).multiplyScalar(-(mode==='fly'?2.6:1.2));wind.y=mode==='fly'?1.5:0;
  acc+=dt;let steps=0;while(acc>=STEP&&steps<3){ropes.forEach(r=>r.step(STEP,clock,wind));drapes.forEach(d=>d.step(STEP,clock,wind));acc-=STEP;steps++}
  if(steps===3)acc=0;
  ropes.forEach(r=>r.build());drapes.forEach(d=>d.build());
  // world ambience
  fogs.forEach((m,i)=>{m.rotation.z+=m.userData.s*dt;m.position.x+=Math.sin(clock*.1+i)*.002});
  wisps.forEach(s=>{const u=s.userData;s.position.set(u.b.x+Math.sin(clock*.4+u.p)*.4,u.b.y+Math.sin(clock*.9+u.p)*.25,u.b.z+Math.cos(clock*.35+u.p)*.4);s.material.opacity=.55+Math.sin(clock*2+u.p)*.35});
  shadow.position.set(HERO.pos.x,.012,HERO.pos.z);const sh=1-Math.min(.6,HERO.pos.y*.35);shadow.scale.set(.95*sh,.95*sh,1);shadow.material.opacity=.55*sh;
  // camera
  if((mode==='fly'||mode==='walk')&&clock-lastDrag>2.5){want.yaw=angLerp(want.yaw,root.rotation.y+Math.PI+(mode==='fly'?.75:1.15),1-Math.exp(-dt*.9))}
  const kc=1-Math.exp(-dt*7);cam.yaw=angLerp(cam.yaw,want.yaw,kc);cam.pitch=lerp(cam.pitch,want.pitch,kc);cam.d=lerp(cam.d,want.d,kc);cam.ty=lerp(cam.ty,want.ty,kc);
  camT.lerp(tmp.set(HERO.pos.x,HERO.pos.y+cam.ty,HERO.pos.z),1-Math.exp(-dt*6));
  const cd=cam.d+swordVis*(view==='game'?0:1.1);
  camera.position.set(camT.x+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cd,camT.y+Math.sin(cam.pitch)*cd,camT.z+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cd);
  if(camera.position.y<.15)camera.position.y=.15;
  camera.lookAt(camT);sky.position.copy(camera.position);
  renderer.render(scene,camera)}
setView('full');requestAnimationFrame(t=>{last=t;frame(t)});
window.__hero={setMode,setView,applyPal,setYaw:y=>{want.yaw=y}};
})();
