/* Layout: full-screen 3D village seen from above; HUD hugs the top edge, overlays (start / 頓悟 cards / result / pause) sit centred over a dimmed scene */
:root{
  --night:#0d1a1a; --ink:#ecf2e9; --dim:#94aaa3; --panel:rgba(9,18,19,.82); --line:#2b4644;
  --jade:#7fe3c6; --cinnabar:#e5483a; --lantern:#ffb35a; --gold:#f2c75c; --violet:#b892ff;
  --f-title:'TPotta',serif; --f-ui:'WenKai','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(3,8,8,.7) 100%)}
.hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 90px 30px rgba(229,72,58,.65)}
.hurt.on{opacity:1;transition:none}
.edge{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;display:none;border:11px solid transparent;border-left:20px solid #ff4a32;filter:drop-shadow(0 0 6px rgba(255,74,50,.8));margin:-11px 0 0 -10px}
.num{position:fixed;left:0;top:0;pointer-events:none;opacity:0;font-size:14px;font-weight:700;color:#eafff8;white-space:nowrap;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 2px #000,0 0 6px rgba(127,227,198,.7)}
.num.go{animation:numUp .7s ease-out forwards}
.num.c{color:#ffe08a;font-size:20px;text-shadow:0 1px 2px #000,0 0 8px rgba(242,199,92,.9)}
.num.b{color:#ffcf7a;font-size:17px;text-shadow:0 1px 2px #000,0 0 8px rgba(255,140,60,.8)}
@keyframes numUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}
.edge.boss{border-left-color:#ffb35a;border-width:15px;border-left-width:26px;margin:-15px 0 0 -13px}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:grid;gap:6px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud[hidden]{display:none}
.wu{height:5px;border-radius:99px;background:rgba(127,227,198,.12);overflow:hidden}
.wu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbfa0,#a8ffe6);box-shadow:0 0 8px var(--jade)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.mid{display:grid;gap:4px}
.side{display:grid;justify-items:end;gap:4px}
.btns{display:flex;gap:6px}
.night{position:relative;height:16px;border-radius:99px;background:rgba(9,18,19,.7);border:1px solid var(--line);overflow:hidden}
.night i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#1b2f45,#5f6f8f 70%,#f2c27a)}
.night b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar)}
.tag{font-size:12px;color:var(--dim);letter-spacing:.1em;text-shadow:0 1px 3px #000;white-space:nowrap}
.pause{all:unset;pointer-events:auto;cursor:pointer;width:34px;height:34px;font-family:var(--f-ui);display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.pause:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.power{font-size:12px;color:var(--dim);letter-spacing:.12em;text-shadow:0 1px 3px #000}
.power b{display:block;font-size:24px;letter-spacing:.02em;color:#fff4d6;text-shadow:0 0 12px rgba(242,199,92,.6),0 2px 0 #1a0f04;font-variant-numeric:tabular-nums;transition:transform .08s}
.power b.pop{transform:scale(1.08)}
.kills{font-size:13px;color:var(--ink);text-align:right;text-shadow:0 1px 3px #000;max-width:46vw}
.kills .tag{white-space:normal;letter-spacing:.05em;line-height:1.3}
.kills b{font-size:18px;color:var(--jade)}
.hp{height:8px;border-radius:99px;background:rgba(229,72,58,.15);border:1px solid rgba(229,72,58,.35);overflow:hidden;width:min(100%,220px)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c43a2e,#ff7a5c)}
.boss{display:none;gap:3px;justify-items:center;margin-top:2px}
.boss.on{display:grid}
.boss span{font-size:13px;letter-spacing:.3em;color:var(--lantern);text-shadow:0 0 8px rgba(255,179,90,.6)}
.boss .hp{width:100%;height:9px}
.boss .hp i{background:linear-gradient(90deg,#d2691e,#ffcf7a)}

/* left stick (floating, visible) and right-hand skill buttons, 傳說對決 style */
.joy{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(127,227,198,.4);
  background:radial-gradient(circle,rgba(127,227,198,.1),rgba(127,227,198,.02));pointer-events:none;opacity:.4;transition:opacity .2s}
.joy.on{opacity:1}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(210,255,242,.75),rgba(127,227,198,.35));box-shadow:0 0 12px rgba(127,227,198,.5)}
#safeL{position:fixed;left:env(safe-area-inset-left,0px);top:0;width:0;height:0;pointer-events:none}
.joy[hidden],.skills[hidden]{display:none}
.skills{position:fixed;right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:236px;height:206px;pointer-events:none}
.sk{all:unset;pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;box-sizing:border-box;display:grid;place-items:center;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 50% 40%,rgba(30,62,60,.92),rgba(8,18,19,.92));border:2px solid rgba(127,227,198,.75);box-shadow:0 0 12px rgba(127,227,198,.35);color:#eafff8;font-family:var(--f-ui)}
.sk .ic{font-size:27px;line-height:1;text-shadow:0 0 8px rgba(127,227,198,.85)}
.sk em{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--dim);white-space:nowrap;text-shadow:0 1px 2px #000;letter-spacing:.1em}
.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);pointer-events:none}
.sk b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.sk[data-sk=sweep]{border-color:#5dff7a;box-shadow:0 0 12px rgba(93,255,122,.35)}.sk[data-sk=sweep] .ic{color:#c8ffd2;text-shadow:0 0 8px rgba(93,255,122,.9)}
.sk[data-sk=beam]{border-color:#ff5a46;box-shadow:0 0 12px rgba(255,90,70,.35)}.sk[data-sk=beam] .ic{color:#ffd2c8;text-shadow:0 0 8px rgba(255,90,70,.9)}
.sk[data-sk=thunder]{border-color:#b784ff;box-shadow:0 0 12px rgba(183,132,255,.4)}.sk[data-sk=thunder] .ic{color:#e8d8ff;text-shadow:0 0 8px rgba(183,132,255,.9)}
.sk.ult{width:84px;height:84px;border-color:#f2c75c;box-shadow:0 0 16px rgba(242,199,92,.45);background:radial-gradient(circle at 50% 40%,rgba(84,62,20,.94),rgba(22,15,6,.94))}
.sk.ult .ic{font-size:38px;color:#ffe9a8;text-shadow:0 0 10px rgba(242,199,92,.9)}
.sk.ult .cd{background:conic-gradient(transparent var(--p,0%),rgba(0,0,0,.72) 0)}
.sk.ult em{color:#f2c75c}
.sk.ult.ready{animation:ultPulse 1s ease-in-out infinite}
@keyframes ultPulse{50%{box-shadow:0 0 34px rgba(242,199,92,1);transform:scale(1.06)}}
.sk.aiming{border-color:#fff!important;box-shadow:0 0 22px rgba(170,240,255,.9)!important}
.sk.no{animation:skNo .25s}
@keyframes skNo{25%{translate:-4px 0}75%{translate:4px 0}}
.cancel{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:30;width:64px;height:64px;border-radius:50%;display:none;place-items:center;
  font-size:14px;letter-spacing:.1em;color:#ffd9d2;background:rgba(40,8,6,.7);border:2px solid rgba(229,72,58,.8);pointer-events:none}
.cancel.on{display:grid}.cancel.hot{background:rgba(229,72,58,.65);color:#fff;transform:scale(1.12)}
.ultFx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,216,106,0) 35%,rgba(255,190,60,.5) 100%)}
.ultFx.on{animation:ultFx 2s ease-out}
@keyframes ultFx{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.banner.ult b{font-family:var(--f-title);font-size:46px;padding:8px 30px;border-color:#f2c75c;color:#fff1c2;background:rgba(30,20,4,.72);text-shadow:0 0 18px rgba(242,199,92,.95),0 3px 0 #2a1a04}
.banner.ult small{color:#f2c75c}
.reqs{list-style:none;margin:3px 0 0;padding:0;display:grid;gap:2px;font-size:12px;text-align:left;width:100%}
.reqs li{display:flex;justify-content:space-between;gap:10px;color:var(--dim)}
.reqs li b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.reqs li.ok b{color:var(--jade)}.reqs li.ok b::after{content:' ✓'}
.reqs li.lock b{color:#9a8a62}

/* ================= 音效（全部用 WebAudio 即時合成，不用音檔） ================= */
let simming=false;// true while sim() fast-forwards: no sounds, no floating numbers
const SFX=(()=>{let ac=null,out=null,nb=null,on=true;const last={};try{on=localStorage.getItem('zk-sfx')!=='0'}catch(e){}
  function resume(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();out=ac.createGain();out.gain.value=.45;out.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

  const GAP={swing:.08,kill:.045,soul:.05,hurt:.15,boom:.09,thunder:.25};
  function play(k){if(!on||!ac||simming||ac.state!=='running')return;const now=ac.currentTime;if(GAP[k]&&now-(last[k]||0)<GAP[k])return;last[k]=now;
    switch(k){
      case 'swing':noise(.1,2400+Math.random()*900,1.4,.1);break;
      case 'kill':tone(620+Math.random()*320,170,.09,'triangle',.13);break;
      case 'soul':tone(1400+Math.random()*400,2300,.05,'sine',.045);break;
      case 'wu':[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.4,'sine',.16,i*.07));break;
      case 'gold':[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,f*1.01,.5,'triangle',.15,i*.06));noise(.6,6000,.8,.06,'highpass');break;
      case 'hurt':tone(170,60,.2,'sawtooth',.2);noise(.12,500,.7,.18,'lowpass');break;
      case 'boom':noise(.32,800,.6,.3,'lowpass');tone(120,50,.25,'sine',.2);break;
      case 'thunder':noise(.6,600,.4,.45,'lowpass');tone(80,35,.5,'sawtooth',.16);break;
      case 'wan':[1568,1319,1047,784].forEach((f,i)=>tone(f,f*.98,.25,'triangle',.1,i*.05));noise(.8,3500,.6,.18,'bandpass');break;
      case 'bell':tone(880,875,1.4,'sine',.22);tone(1320,1316,.9,'sine',.08);break;
      case 'boss':tone(110,65,1,'sawtooth',.22);tone(164,80,1,'square',.08);noise(.8,300,.6,.2,'lowpass');break;
      case 'bossDie':noise(1.2,500,.4,.5,'lowpass');tone(220,40,1.2,'sawtooth',.2);[784,988,1175,1568].forEach((f,i)=>tone(f,f,.5,'triangle',.14,.4+i*.09));break;
      case 'win':[[600,900],[640,960],[700,1150]].forEach(([a,b],i)=>tone(a,b,.28,'square',.07,i*.32));[392,523,659,784,1047].forEach((f,i)=>tone(f,f,.6,'triangle',.16,1+i*.12));break;
      case 'sweep':noise(.35,900,.5,.3,'bandpass');noise(.3,2600,1,.15,'bandpass',.05);tone(300,900,.25,'triangle',.08);break;
      case 'beam':tone(500,1800,.22,'sawtooth',.06);noise(.3,4000,.8,.16,'highpass');break;
      case 'ready':[784,1175,1568].forEach((f,i)=>tone(f,f,.3,'sine',.14,i*.08));break;
      case 'ult':[262,330,392,523,659,784].forEach((f,i)=>tone(f,f,1.2,'triangle',.12,i*.05));noise(1.4,1200,.5,.3,'bandpass');tone(80,40,1.2,'sawtooth',.18);break;
      case 'rooster':[[520,780,.16],[780,1040,.2],[1040,640,.6]].forEach(([a,b,d],i)=>tone(a,b,d,'sawtooth',.06,[0,.17,.4][i]));break;

/* ================= 背景音樂：WebAudio 即時合成，不用音檔 =================
   古箏撥弦（三角波＋撥弦雜音）＋低音持續＋木魚／磬，加一點殘響。
   mood: home（洞府，安靜五聲）、night（怪談，小調五聲）、boss（緊張，加鼓）。跟音效同一個「音」開關。 */
const BGM=(()=>{let ac=null,bus=null,verb=null,mood=null,timer=0,nextT=0,step=0,deg=7,drone=[];
  const SC={home:[0,2,4,7,9],night:[0,3,5,7,10],boss:[0,1,5,7,8]},ROOT={home:196,night:174.6,boss:164.8},BPM={home:58,night:70,boss:112};

    // a cheap hall: convolver with a decaying noise impulse
    verb=ac.createConvolver();const len=ac.sampleRate*2.4,ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    verb.buffer=ir;const wet=ac.createGain();wet.gain.value=.35;bus.connect(SFX.out);bus.connect(verb);verb.connect(wet);wet.connect(SFX.out);return true}
  const note=d=>{const sc=SC[mood],o=Math.floor(d/5),i=((d%5)+5)%5;return ROOT[mood]*Math.pow(2,o+sc[i]/12)};
  function pluck(f,t,v=.16,dur=1.6){const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
    o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(bus);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
    // slight pitch bend at the start, like a 古箏 press
    o.frequency.setValueAtTime(f*.985,t);o.frequency.linearRampToValueAtTime(f,t+.06)}
  function block(t,v=.12){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(950,t);o.frequency.exponentialRampToValueAtTime(620,t+.07);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.12)}
  function bell(f,t,v=.09){[1,2.76,5.4].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(v/(i+1),t);g.gain.exponentialRampToValueAtTime(.001,t+3.2/(i+1));o.connect(g);g.connect(bus);o.start(t);o.stop(t+3.4)})}
  function drum(t,v=.3){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.25);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.32)}
  function startDrone(){stopDrone();[1,1.5].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
    o.type='sine';o.frequency.value=ROOT[mood]/2*m*(1+i*.003);g.gain.value=0;g.gain.linearRampToValueAtTime(mood==='boss'?.05:.04,ac.currentTime+2);
    l.frequency.value=.07+i*.05;lg.gain.value=.02;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(bus);o.start();l.start();drone.push({o,g,l})})}

  function sched(){if(!mood||!ac)return;const spb=60/BPM[mood]/2;// eighth notes
    while(nextT<ac.currentTime+.4){const t=nextT,s=step%16;

  return {play,stop,resumeIfOn(){if(SFX.on&&mood){const m=mood;mood=null;play(m)}},get mood(){return mood}}})();

/* ================= 省電模式（防過熱） =================
   自動：手機上前 3 秒平均低於 40 fps 就降解析度、減少特效；也可以在暫停選單切「開／關」。 */
const POWER=(()=>{let mode='auto',low=false,acc=0,frames=0;try{mode=localStorage.getItem('zk-power')||'auto'}catch(e){}
  if(mode==='on')low=true;
  const hi=()=>Math.min(window.devicePixelRatio||1,isTouch?1.5:2);
  function apply(){renderer.setPixelRatio(low?Math.min(1,hi()):hi());const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false)}

  function cycle(){mode={auto:'on',on:'off',off:'auto'}[mode];low=mode==='on';try{localStorage.setItem('zk-power',mode)}catch(e){}apply();return mode}
  if(low)apply();
  return {tick,cycle,get low(){return low},get label(){return {auto:'自動',on:'開',off:'關'}[mode]}}})();

   每格＝程式畫的水墨小圖＋一兩行字；點畫面下一格，「跳過」直接結束。也用來做「雞啼」天亮過場。
   場景畫法都在 INK_SCENES，之後的章節加新場景就好。 */
const INK=(()=>{const W=800,H=360;
  const rnd=(a,b)=>a+Math.random()*(b-a);

    x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.strokeStyle='rgba(60,50,40,.25)';x.lineWidth=1.5;x.stroke()}
  function roofs(x,base,n){for(let i=0;i<n;i++){const cx=60+i*(W-120)/(n-1)+rnd(-20,20),w=rnd(70,110),h=rnd(36,55);x.fillStyle='rgba(22,22,24,.92)';

  function figure(x,cx,base,s,o={}){x.save();x.translate(cx,base);x.scale(s,s);x.fillStyle=o.col||'rgba(18,18,20,.94)';
    x.beginPath();x.moveTo(-26,0);x.lineTo(-14,-70);x.lineTo(14,-70);x.lineTo(26,0);x.closePath();x.fill();// robe
    x.beginPath();x.moveTo(-14,-66);x.quadraticCurveTo(-40,-50,-44,-26);x.lineTo(-30,-30);x.quadraticCurveTo(-24,-48,-12,-56);x.fill();// sleeve

    if(o.small){}x.restore()}

function pickNear(x,z,r,used){let best=null,bd=r*r;for(const e of enemies){if(e.dead||used.has(e))continue;const d=(e.x-x)**2+(e.z-z)**2;if(d<bd&&onScreen(e.x,.4,e.z)){bd=d;best=e}}return best}
function chainCast(){const lv=G.k.thLv,hops=G.k.thN+(lv>=1?3:0),dmg=swordDmg()*2.8*G.k.thD,used=new Set(),hx=HERO.pos.x,hz=HERO.pos.z,R=SK.thunder.range();
  const starts=[];for(let c=0;c<(lv>=2?2:1);c++){let tg=null;if(c===0&&boss.alive&&bossOnScreen()&&Math.hypot(boss.x-hx,boss.z-hz)<R+boss.r)tg=boss;else tg=pickNear(hx,hz,R,used);if(!tg)break;used.add(tg);starts.push(tg)}
  if(!starts.length)return false;SFX.play('thunder');shake=Math.max(shake,.2);buzz(15);
  starts.forEach(tg0=>{let cur=tg0,px=hx,pz=hz,n=0,end=false;
    act(hops*.09+.2,t=>{while(cur&&t>=n*.09){const x=cur.x,z=cur.z;zap(px,pz,x,z);boltAt(x,z,dmg,1.1,0xb889ff,.07);if(n%3===2)SFX.play('thunder');
        if(cur!==boss)cur.stun=Math.max(cur.stun||0,.8);
        if(lv>=1){const near=enemies.filter(e=>!e.dead&&e!==cur&&(e.x-x)**2+(e.z-z)**2<9).slice(0,2);for(const e of near){zap(x,z,e.x,e.z);hurtEnemy(e,dmg*.5,0,0,false,3)}}
        n++;px=x;pz=z;let nx=n<hops?pickNear(x,z,4.5,used):null;if(nx)used.add(nx);
        if(!nx&&lv>=3&&!end){end=true;boltAt(x,z,dmg*4,2.6,0xe6d2ff,.3,14);shake=Math.max(shake,.6);SFX.play('boom');for(const e of enemies)if(!e.dead&&(e.x-x)**2+(e.z-z)**2<6.8)e.stun=Math.max(e.stun||0,1.5);
          fx({p:tmp.set(x,.5,z),col:0xb98aff,add:true,life:.6,s0:2,s1:8,op:1,vy:0})}

const iceMat=new THREE.MeshBasicMaterial({color:0xc8f6ff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false});

  for(let i=0;i<12;i++){const b=new THREE.Group();g.add(b);part(new THREE.BoxGeometry(.11,.025,.95),iceMat,b,{ol:false});const tp=new THREE.ConeGeometry(.075,.26,4);tp.rotateX(Math.PI/2);part(tp,iceMat,b,{p:[0,0,.6],ol:false});
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x8fe8ff,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(1.2,1.2,1);b.add(s);blades.push(b)}

  return {g,blades,disc}})();
function frostCast(){const lv=G.k.sweepLv,R=SK.sweep.range(),dmg=swordDmg()*4.6*G.k.sweepD,passes=lv>=2?2:1,T=.42,life=passes*T+.25,hit=[new Set(),new Set()];
  SFX.play('sweep');SFX.play('bell');shake=Math.max(shake,.2);buzz(20);frostRing.g.visible=frostRing.disc.visible=true;
  act(life,t=>{const p=Math.min(passes-1,Math.floor(t/T)),k=Math.min(1,(t-p*T)/T),e=1-Math.pow(1-k,2),r=p===0?.4+(R-.4)*e:R-(R-.6)*e,hx=HERO.pos.x,hz=HERO.pos.z;
      frostRing.g.position.set(hx,.8,hz);frostRing.blades.forEach((b,i)=>{const a=i/12*Math.PI*2+t*9;b.position.set(Math.sin(a)*r,0,Math.cos(a)*r);b.rotation.y=a+Math.PI/2});
      frostRing.disc.position.set(hx,.07,hz);frostRing.disc.scale.setScalar(Math.max(.05,r));frostRing.disc.material.opacity=.6*(t>life-.25?Math.max(0,(life-t)/.25):1);if(t>life-.25)frostRing.g.visible=false;
      if(t>passes*T)return;const H=hit[p];let killed=0;
      for(const en of enemies){if(en.dead||H.has(en))continue;const dx=en.x-hx,dz=en.z-hz,d=Math.hypot(dx,dz);
        if(Math.abs(d-r)<.6+en.r||(p===0&&d<r)){H.add(en);en.slowT=3;if(lv>=3)en.stun=Math.max(en.stun||0,1.5);hurtEnemy(en,dmg,dx/(d||1)*.8,dz/(d||1)*.8,false,5);if(en.dead)killed++;
          if(!simming)fx({p:tmp.set(en.x,.7,en.z),col:0xbff4ff,add:true,life:.3,s0:1,s1:.2,op:.9,vy:0})}}
      if(boss.alive&&!H.has(boss)){const d=Math.hypot(boss.x-hx,boss.z-hz);if(Math.abs(d-r)<.6+boss.r||d<r){H.add(boss);hurtBoss(dmg)}}

function dragonCast(A){const lv=G.k.beamLv,L=SK.beam.range(),a0=Math.atan2(A.dir[0],A.dir[1]),n=DRAGON_N[lv],sp=DRAGON_SPREAD[lv],dmg=swordDmg()*4.4*G.k.beamD*[1,.9,.8,.7,.6][lv],hx=HERO.pos.x,hz=HERO.pos.z,hitN=new Map();

    const segs=[];if(!simming)for(let i=0;i<7;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:i===0?0xffe08a:i<3?0xff8a2a:0xff4a1a,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
      const sc=i===0?1.7:1.35-i*.12;s.scale.set(sc,sc,1);s.visible=false;scene.add(s);segs.push(s)}
    act(T+.4,t=>{segs.forEach((s,i)=>{const tt=t-i*.05;if(tt<0||tt>T){s.visible=false;return}const dd=tt/T*L,w=Math.sin(dd*1.3+j)*.5;s.visible=true;s.position.set(hx+dx*dd+dz*w,.75+Math.sin(dd*2.2)*.2,hz+dz*dd-dx*w)});
        if(t>T)return;const dd=t/T*L,w=Math.sin(dd*1.3+j)*.5,x=hx+dx*dd+dz*w,z=hz+dz*dd-dx*w;
        if(!simming)while(trail<dd){trail+=1;fx({p:tmp.set(hx+dx*trail,.3,hz+dz*trail),col:0xff7a2a,add:true,life:1.5,s0:1,s1:.4,op:.7,vy:.3})}
        for(const en of enemies){if(en.dead||mine.has(en))continue;if((en.x-x)**2+(en.z-z)**2<(1+en.r)**2){mine.add(en);const c=hitN.get(en)||0;if(c>=2)continue;hitN.set(en,c+1);en.burn=3;en.burnD=dmg*.12;hurtEnemy(en,dmg,dx*.8,dz*.8,false,4.5)}}
        if(boss.alive&&!mine.has(boss)&&(boss.x-x)**2+(boss.z-z)**2<(1+boss.r)**2){mine.add(boss);const c=hitN.get(boss)||0;if(c<3){hitN.set(boss,c+1);hurtBoss(dmg)}}},
      ()=>{segs.forEach(s=>{scene.remove(s);s.material.dispose()})})}}

const TAIJI_LV=['範圍 +30%','雙氣旋：同時捲兩團妖','爆開後定身 1.5 秒、傷害 +50%'];
const taijiTex=ctex(256,256,x=>{x.translate(128,128);const R=116;x.fillStyle='rgba(240,238,228,.92)';x.beginPath();x.arc(0,0,R,0,7);x.fill();
  x.fillStyle='rgba(12,12,16,.92)';x.beginPath();x.arc(0,0,R,-Math.PI/2,Math.PI/2);x.arc(0,R/2,R/2,Math.PI/2,Math.PI*1.5);x.arc(0,-R/2,R/2,Math.PI/2,-Math.PI/2,true);x.fill();
  x.beginPath();x.arc(0,-R/2,R/7,0,7);x.fill();x.fillStyle='rgba(240,238,228,.92)';x.beginPath();x.arc(0,R/2,R/7,0,7);x.fill();
  x.strokeStyle='rgba(255,216,106,.95)';x.lineWidth=6;x.beginPath();x.arc(0,0,R+4,0,7);x.stroke()});
function crowdSpots(hx,hz,R,r,n){const cand=enemies.filter(e=>!e.dead&&(e.x-hx)**2+(e.z-hz)**2<R*R&&onScreen(e.x,.4,e.z));const out=[];
  for(let k=0;k<n;k++){let best=null,bn=0;const step=Math.max(1,Math.floor(cand.length/40));
    for(let i=0;i<cand.length;i+=step){const e=cand[i];if(out.some(([x,z])=>(e.x-x)**2+(e.z-z)**2<(r*1.6)**2))continue;let c=0;for(const o of cand)if((o.x-e.x)**2+(o.z-e.z)**2<r*r)c++;if(c>bn){bn=c;best=e}}
    if(!best)break;out.push([best.x,best.z])}
  if(!out.length&&boss.alive&&bossOnScreen()&&Math.hypot(boss.x-hx,boss.z-hz)<R+2)out.push([boss.x,boss.z]);return out}
function taijiAt(x,z,r,dmg,lv){const m=new THREE.Mesh(new THREE.CircleGeometry(1,48).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:taijiTex,transparent:true,opacity:0,depthWrite:false}));
  m.position.set(x,.07,z);m.scale.setScalar(r);m.renderOrder=3;scene.add(m);let burst=false,tick=0;
  act(1.9,(t,dt)=>{m.rotation.y-=dt*(3+t*5);m.material.opacity=Math.min(.85,t*3)*(t>1.6?Math.max(0,1-(t-1.6)/.3):1);
      if(t<1.4){tick-=dt;for(const e of enemies){if(e.dead||e.elite)continue;const dx=x-e.x,dz=z-e.z,d=Math.hypot(dx,dz);if(d<r+1.6&&d>.25){const v=Math.min(d,(3+4*(1-d/(r+1.6)))*dt);e.x+=dx/d*v;e.z+=dz/d*v}}
        if(tick<=0){tick=.35;for(const e of enemies)if(!e.dead&&(e.x-x)**2+(e.z-z)**2<r*r)hurtEnemy(e,dmg*.12,0,0,false,0);
          if(!simming)fx({p:tmp.set(x+(Math.random()-.5)*r,.5,z+(Math.random()-.5)*r),col:Math.random()<.5?0xf0eee4:0x101014,life:.6,s0:.8,s1:.2,op:.8,vy:1.2})}}
      else if(!burst){burst=true;SFX.play('boom');shake=Math.max(shake,.4);buzz(25);
        fx({p:tmp.set(x,.5,z),col:0xfff6d8,add:true,life:.5,s0:1,s1:r*2.8,op:1,vy:0});fx({p:tmp.set(x,.5,z),col:0x101014,life:.8,s0:1,s1:r*2.2,op:.7,vy:.8});
        const D=dmg*(lv>=3?1.5:1);for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dz=e.z-z,d=Math.hypot(dx,dz);if(d<r+.3){if(lv>=3)e.stun=Math.max(e.stun||0,1.5);hurtEnemy(e,D,dx/(d||1)*1.5,dz/(d||1)*1.5,false,6)}}
        if(boss.alive&&(boss.x-x)**2+(boss.z-z)**2<(r+boss.r)**2)hurtBoss(D)}},
    ()=>{scene.remove(m);m.geometry.dispose();m.material.dispose()})}
function taijiCast(){const lv=G.k.thLv,R=SK.thunder.range(),r=2.4*(lv>=1?1.3:1),dmg=swordDmg()*4*G.k.thD,spots=crowdSpots(HERO.pos.x,HERO.pos.z,R,r,lv>=2?2:1);

/* ================= 敵方預警範圍（紅色）=================
   warnFan 扇形、warnLine 直線（長槍突刺、船槳掃）、wave 擴散環（留一個缺口要鑽過去）。
   狀態：G.rootT 定身、G.slowT 緩速、G.charm 魅惑（搖桿反向）。 */
const HZ=[];const hzMat=c=>new THREE.MeshBasicMaterial({color:c||0xff3b2a,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide});
const lineGeo=new THREE.PlaneGeometry(1,1).rotateX(-Math.PI/2).translate(0,0,.5);
function warnFan(x,z,a0,ang,r,delay,dmg,col,onHit){const m=new THREE.Mesh(fanGeo(ang),hzMat(col));m.position.set(x,.04,z);m.rotation.y=a0;m.scale.setScalar(r);scene.add(m);HZ.push({k:'fan',x,z,a0,ang,r,delay,dmg,t:0,m,onHit})}
function warnLine(x,z,a0,len,w,delay,dmg,col,onHit){const m=new THREE.Mesh(lineGeo,hzMat(col));m.position.set(x,.04,z);m.rotation.y=a0;m.scale.set(w,1,len);scene.add(m);HZ.push({k:'line',x,z,a0,len,w,delay,dmg,t:0,m,onHit})}
function wave(x,z,spd,maxR,gapA,gapW,dmg,col,onHit){const g=new THREE.RingGeometry(.9,1,64,1,-Math.PI/2+gapA+gapW/2,Math.PI*2-gapW).rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col||0xffb35a,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.position.set(x,.08,z);scene.add(m);
  HZ.push({k:'wave',x,z,spd,maxR,gapA,gapW,dmg,t:0,m,onHit,hit:false})}
function inGap(h,ang){return Math.abs(angDiff(ang,h.gapA))<h.gapW/2}
function stepHZ(dt){for(let i=HZ.length-1;i>=0;i--){const h=HZ[i];h.t+=dt;const hx=HERO.pos.x-h.x,hz=HERO.pos.z-h.z,d=Math.hypot(hx,hz);
    if(h.k==='wave'){const R=h.spd*h.t;h.m.scale.setScalar(Math.max(.01,R));h.m.material.opacity=.85*(1-R/h.maxR*.6);
      if(!h.hit&&Math.abs(d-R)<.45&&!inGap(h,Math.atan2(hx,hz))){h.hit=true;hurtHero(h.dmg,0,0,'衝擊波');if(h.onHit)h.onHit()}
      if(R>=h.maxR){scene.remove(h.m);h.m.geometry.dispose();h.m.material.dispose();HZ.splice(i,1)}continue}
    h.m.material.opacity=.22+.2*Math.abs(Math.sin(h.t*12));
    if(h.t>=h.delay){let hit=false;if(h.k==='fan')hit=d<h.r&&Math.abs(angDiff(Math.atan2(hx,hz),h.a0))<=h.ang/2;
      else{const ux=Math.sin(h.a0),uz=Math.cos(h.a0),al=hx*ux+hz*uz,pe=Math.abs(hx*uz-hz*ux);hit=al>-.3&&al<h.len&&pe<h.w/2+.25}
      fx({p:tmp.set(h.x+Math.sin(h.a0)*(h.k==='fan'?h.r*.5:h.len*.5),.5,h.z+Math.cos(h.a0)*(h.k==='fan'?h.r*.5:h.len*.5)),col:0xff6a2a,add:true,life:.35,s0:1,s1:3,op:.9,vy:0});
      if(hit){hurtHero(h.dmg,0,0,h.k==='fan'?'橫掃':'突刺');if(h.onHit)h.onHit()}scene.remove(h.m);h.m.material.dispose();HZ.splice(i,1)}}}
function clearHZ(){HZ.forEach(h=>{scene.remove(h.m);h.m.material.dispose()});HZ.length=0}

   難度：妖血 ×1.1^推薦境界×(1+0.08×章)；魔王血 ×1.1^推薦境界×(1+0.15×章)。 */
