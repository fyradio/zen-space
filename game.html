/* Layout: full-screen 3D village seen from above; HUD hugs the top edge, overlays (start / 頓悟 cards / result / pause) sit centred over a dimmed scene */
:root{
  --night:#0d1a1a; --ink:#ecf2e9; --dim:#94aaa3; --panel:rgba(9,18,19,.82); --line:#2b4644;
  --jade:#7fe3c6; --cinnabar:#e5483a; --lantern:#ffb35a; --gold:#f2c75c; --violet:#b892ff;
  --f-title:'TPotta',serif; --f-ui:'WenKai','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(3,8,8,.7) 100%)}
.hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 90px 30px rgba(229,72,58,.65)}
.hurt.on{opacity:1;transition:none}
.edge{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;display:none;border:11px solid transparent;border-left:20px solid #ff4a32;filter:drop-shadow(0 0 6px rgba(255,74,50,.8));margin:-11px 0 0 -10px}
.num{position:fixed;left:0;top:0;pointer-events:none;opacity:0;font-size:14px;font-weight:700;color:#eafff8;white-space:nowrap;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 2px #000,0 0 6px rgba(127,227,198,.7)}
.num.go{animation:numUp .7s ease-out forwards}
.num.c{color:#ffe08a;font-size:20px;text-shadow:0 1px 2px #000,0 0 8px rgba(242,199,92,.9)}
.num.b{color:#ffcf7a;font-size:17px;text-shadow:0 1px 2px #000,0 0 8px rgba(255,140,60,.8)}
@keyframes numUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}
.edge.boss{border-left-color:#ffb35a;border-width:15px;border-left-width:26px;margin:-15px 0 0 -13px}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:grid;gap:6px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud[hidden]{display:none}
.wu{height:5px;border-radius:99px;background:rgba(127,227,198,.12);overflow:hidden}
.wu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbfa0,#a8ffe6);box-shadow:0 0 8px var(--jade)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr);gap:14px;align-items:start}
.row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.mid{display:grid;gap:4px}
.side{display:grid;justify-items:end;gap:4px}
.btns{display:flex;gap:6px}
.night{position:relative;height:16px;border-radius:99px;background:rgba(9,18,19,.7);border:1px solid var(--line);overflow:hidden}
.night i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#1b2f45,#5f6f8f 70%,#f2c27a)}
.night b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar)}
.tag{font-size:12px;color:var(--dim);letter-spacing:.1em;text-shadow:0 1px 3px #000;white-space:nowrap}
.pause{all:unset;pointer-events:auto;cursor:pointer;width:34px;height:34px;font-family:var(--f-ui);display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.pause:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.power{font-size:12px;color:var(--dim);letter-spacing:.12em;text-shadow:0 1px 3px #000}
.power b{display:block;font-size:24px;letter-spacing:.02em;color:#fff4d6;text-shadow:0 0 12px rgba(242,199,92,.6),0 2px 0 #1a0f04;font-variant-numeric:tabular-nums;transition:transform .08s}
.power b.pop{transform:scale(1.08)}
.kills{font-size:13px;color:var(--ink);text-align:right;text-shadow:0 1px 3px #000;max-width:46vw}
.kills .tag{white-space:normal;letter-spacing:.05em;line-height:1.3}
.kills b{font-size:18px;color:var(--jade)}
.hp{height:8px;border-radius:99px;background:rgba(229,72,58,.15);border:1px solid rgba(229,72,58,.35);overflow:hidden;width:min(100%,220px)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c43a2e,#ff7a5c)}
.boss{display:none;gap:3px;justify-items:center;margin-top:2px}
.boss.on{display:grid}
.boss span{font-size:13px;letter-spacing:.3em;color:var(--lantern);text-shadow:0 0 8px rgba(255,179,90,.6)}
.boss .hp{width:100%;height:9px}
.boss .hp i{background:linear-gradient(90deg,#d2691e,#ffcf7a)}

/* left stick (floating, visible) and right-hand skill buttons, 傳說對決 style */
.joy{position:fixed;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(127,227,198,.4);
  background:radial-gradient(circle,rgba(127,227,198,.1),rgba(127,227,198,.02));pointer-events:none;opacity:.4;transition:opacity .2s}
.joy.on{opacity:1}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(210,255,242,.75),rgba(127,227,198,.35));box-shadow:0 0 12px rgba(127,227,198,.5)}
#safeL{position:fixed;left:env(safe-area-inset-left,0px);top:0;width:0;height:0;pointer-events:none}
.joy[hidden],.skills[hidden]{display:none}
.skills{position:fixed;right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:236px;height:206px;pointer-events:none}
.sk{all:unset;pointer-events:auto;position:absolute;width:62px;height:62px;border-radius:50%;box-sizing:border-box;display:grid;place-items:center;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 50% 40%,rgba(30,62,60,.92),rgba(8,18,19,.92));border:2px solid rgba(127,227,198,.75);box-shadow:0 0 12px rgba(127,227,198,.35);color:#eafff8;font-family:var(--f-ui)}
.sk .ic{font-size:27px;line-height:1;text-shadow:0 0 8px rgba(127,227,198,.85)}
.sk em{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--dim);white-space:nowrap;text-shadow:0 1px 2px #000;letter-spacing:.1em}
.sk .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);pointer-events:none}
.sk b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.sk.ult{width:84px;height:84px;border-color:#f2c75c;box-shadow:0 0 16px rgba(242,199,92,.45);background:radial-gradient(circle at 50% 40%,rgba(84,62,20,.94),rgba(22,15,6,.94))}
.sk.ult .ic{font-size:38px;color:#ffe9a8;text-shadow:0 0 10px rgba(242,199,92,.9)}
.sk.ult .cd{background:conic-gradient(transparent var(--p,0%),rgba(0,0,0,.72) 0)}
.sk.ult em{color:#f2c75c}
.sk.ult.ready{animation:ultPulse 1s ease-in-out infinite}
@keyframes ultPulse{50%{box-shadow:0 0 34px rgba(242,199,92,1);transform:scale(1.06)}}
.sk.aiming{border-color:#fff;box-shadow:0 0 22px rgba(170,240,255,.9)}
.sk.no{animation:skNo .25s}
@keyframes skNo{25%{translate:-4px 0}75%{translate:4px 0}}
.cancel{position:fixed;right:calc(env(safe-area-inset-right,0px) + 26px);top:calc(env(safe-area-inset-top,0px) + 74px);width:64px;height:64px;border-radius:50%;display:none;place-items:center;
  font-size:14px;letter-spacing:.1em;color:#ffd9d2;background:rgba(40,8,6,.7);border:2px solid rgba(229,72,58,.8);pointer-events:none}
.cancel.on{display:grid}.cancel.hot{background:rgba(229,72,58,.65);color:#fff;transform:scale(1.12)}
.ultFx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(255,216,106,0) 35%,rgba(255,190,60,.5) 100%)}
.ultFx.on{animation:ultFx 2s ease-out}
@keyframes ultFx{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.banner.ult b{font-family:var(--f-title);font-size:46px;padding:8px 30px;border-color:#f2c75c;color:#fff1c2;background:rgba(30,20,4,.72);text-shadow:0 0 18px rgba(242,199,92,.95),0 3px 0 #2a1a04}
.banner.ult small{color:#f2c75c}
.reqs{list-style:none;margin:3px 0 0;padding:0;display:grid;gap:2px;font-size:12px;text-align:left;width:100%}
.reqs li{display:flex;justify-content:space-between;gap:10px;color:var(--dim)}
.reqs li b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.reqs li.ok b{color:var(--jade)}.reqs li.ok b::after{content:' ✓'}
.reqs li.lock b{color:#9a8a62}
.btn.gold{border-color:#f2c75c;color:#fff1c2;background:linear-gradient(180deg,rgba(242,199,92,.32),rgba(242,199,92,.08));animation:ultPulse 1.3s ease-in-out infinite}
.btn[hidden],.tag[hidden]{display:none}
.breakBtn{all:unset;position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 74px);pointer-events:auto;cursor:pointer;
  padding:8px 18px;border-radius:999px;border:2px solid #f2c75c;background:linear-gradient(180deg,rgba(120,86,20,.92),rgba(40,26,6,.92));color:#fff1c2;font-family:var(--f-ui);
  font-size:18px;letter-spacing:.2em;text-align:center;animation:ultPulse 1.1s ease-in-out infinite}
.breakBtn small{display:block;font-size:10px;letter-spacing:.2em;color:#f2c75c}
.breakBtn[hidden]{display:none}
/* overlays */
.ov{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(3,8,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{display:grid}
.box{width:min(100%,420px);display:grid;gap:12px;justify-items:center;text-align:center}
h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(46px,14vw,74px);line-height:1.05;color:#eef6ea;text-shadow:0 0 18px rgba(127,227,198,.5),0 3px 0 #071010}
h1 .zhan{color:var(--cinnabar);text-shadow:0 0 18px rgba(229,72,58,.55),0 3px 0 #2a0906}
h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.2em}
.sub{font-size:14px;letter-spacing:.3em;color:var(--dim)}
.txt{font-size:14px;line-height:1.7;color:var(--ink);opacity:.9}
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:48px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);font-size:17px;letter-spacing:.18em;color:var(--ink)}
.btn.go{border-color:var(--jade);background:linear-gradient(180deg,rgba(127,227,198,.3),rgba(127,227,198,.08));color:#fff}
.btn small{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim);margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.btn[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(127,227,198,.12)}
.stat{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px;justify-content:center}
.stat dt{color:var(--dim);text-align:right}.stat dd{margin:0;text-align:left;color:#fff4d6}
.realm{width:100%;display:grid;gap:4px;font-size:13px;color:var(--dim)}
.realm .wu{height:8px}

.cards{display:grid;gap:10px;width:100%}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;
  border-radius:14px;border:1px solid var(--line);background:var(--panel);animation:flip .35s ease-out backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
/* phone rotation hint */
.ov.rot{z-index:50;background:rgba(3,8,9,.94)}
.phone{width:46px;height:78px;border:3px solid var(--jade);border-radius:9px;animation:turn 2s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* landscape phones: two-column overlays, three cards side by side, slimmer HUD */
@media (orientation:landscape) and (max-height:560px){
  .ov{padding:10px calc(env(safe-area-inset-right,0px) + 18px) 10px calc(env(safe-area-inset-left,0px) + 18px)}
  .box{width:min(100%,780px);gap:8px}
  .box.two{grid-template-columns:1.1fr 1fr;align-items:center;column-gap:30px}
  .box.two>.col{display:grid;gap:9px;justify-items:center;width:100%}
  h1{font-size:clamp(36px,12vh,62px)}
  h2{font-size:20px}
  .txt{font-size:13px;line-height:1.55}
  .cards{grid-template-columns:repeat(3,1fr)}
  .card{grid-template-columns:1fr;justify-items:center;text-align:center;padding:10px 8px;gap:4px}
  body .card .ic{grid-row:auto;width:44px;height:44px;font-size:22px}
  .btn{min-height:42px;font-size:16px}
  #skipCard{width:auto;padding:0 44px}
  .power b{font-size:20px}
  body .banner{top:17%}
  body .banner b{font-size:17px;padding:7px 18px}
  body .banner.ult b{font-size:40px}
  .hud{gap:4px}
}
@keyframes flip{from{transform:rotateY(80deg) scale(.9);opacity:0}}
.card .ic{grid-row:span 2;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(127,227,198,.1);color:var(--jade)}
.card b{font-size:17px;letter-spacing:.08em}.card span{font-size:13px;color:var(--dim);line-height:1.5}
.card em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.card.r1{border-color:var(--violet);box-shadow:0 0 16px rgba(184,146,255,.25)}.card.r1 .ic{color:var(--violet);background:rgba(184,146,255,.12)}.card.r1 em{color:var(--violet)}
.card.r2{border-color:var(--gold);box-shadow:0 0 20px rgba(242,199,92,.35)}.card.r2 .ic{color:var(--gold);background:rgba(242,199,92,.12)}.card.r2 em{color:var(--gold)}
.card.r0 em{color:var(--dim)}

.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}
.banner.on{opacity:1;transform:none}
.banner b{display:inline-block;padding:10px 22px;border-radius:12px;background:rgba(20,6,4,.75);border:1px solid var(--cinnabar);font-size:20px;letter-spacing:.12em;color:#ffd9c2;
  text-shadow:0 0 10px rgba(229,72,58,.7)}
.banner small{display:block;font-size:13px;color:var(--lantern);letter-spacing:.3em;margin-bottom:4px}
.bubble{position:fixed;left:0;top:0;max-width:220px;padding:7px 11px;border-radius:12px;background:rgba(255,236,206,.94);color:#3a200c;font-size:14px;line-height:1.45;
  pointer-events:none;opacity:0;transition:opacity .3s;transform:translate(-50%,-100%)}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,236,206,.94)}

/* ---------- face parameters (捏臉): defaults are the current look; sliders edit F, 「複製設定」 exports it ---------- */
const IRIS=[['#2a1812','#5b3624','#8e6235','#3a2418','#1d120e'],['#0c0a0b','#1d1618','#33262a','#1b1315','#0b0809'],['#0e2a2a','#1f5a58','#3f9a8e','#18403c','#0b1c1c'],['#3a1f0a','#8a4f1c','#d49a3c','#5a3312','#2a1608'],['#1c1230','#3d2a6b','#7a62b8','#2a1d4a','#150e26']];

  if(boss.alive&&!(skip&&skip.has(boss))){const d=(boss.x-x)**2+(boss.z-z)**2;if(d<bd+boss.r*boss.r&&bossOnScreen())best=boss}return best}
