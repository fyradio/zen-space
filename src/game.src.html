<title>午夜來斬妖 序章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*FONTS*/
/* Layout: full-screen 3D village seen from above; HUD hugs the top edge, overlays (start / 頓悟 cards / result / pause) sit centred over a dimmed scene */
:root{
  --night:#0d1a1a; --ink:#ecf2e9; --dim:#94aaa3; --panel:rgba(9,18,19,.82); --line:#2b4644;
  --jade:#7fe3c6; --cinnabar:#e5483a; --lantern:#ffb35a; --gold:#f2c75c; --violet:#b892ff;
  --f-title:'TPotta',serif; --f-ui:'WenKai','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--f-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 55%,rgba(3,8,8,.7) 100%)}
.hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 90px 30px rgba(229,72,58,.65)}
.hurt.on{opacity:1;transition:none}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:grid;gap:6px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud[hidden]{display:none}
.wu{height:5px;border-radius:99px;background:rgba(127,227,198,.12);overflow:hidden}
.wu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fbfa0,#a8ffe6);box-shadow:0 0 8px var(--jade)}
.row1{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.night{position:relative;height:16px;border-radius:99px;background:rgba(9,18,19,.7);border:1px solid var(--line);overflow:hidden}
.night i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#1b2f45,#5f6f8f 70%,#f2c27a)}
.night b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 6px var(--cinnabar)}
.tag{font-size:12px;color:var(--dim);letter-spacing:.1em;text-shadow:0 1px 3px #000;white-space:nowrap}
.pause{all:unset;pointer-events:auto;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.pause:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.power{font-size:12px;color:var(--dim);letter-spacing:.12em;text-shadow:0 1px 3px #000}
.power b{display:block;font-size:24px;letter-spacing:.02em;color:#fff4d6;text-shadow:0 0 12px rgba(242,199,92,.6),0 2px 0 #1a0f04;font-variant-numeric:tabular-nums;transition:transform .08s}
.power b.pop{transform:scale(1.08)}
.kills{font-size:13px;color:var(--ink);text-align:right;text-shadow:0 1px 3px #000;max-width:46vw}
.kills .tag{white-space:normal;letter-spacing:.05em;line-height:1.3}
.kills b{font-size:18px;color:var(--jade)}
.hp{height:8px;border-radius:99px;background:rgba(229,72,58,.15);border:1px solid rgba(229,72,58,.35);overflow:hidden;width:min(46vw,200px)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c43a2e,#ff7a5c)}
.boss{display:none;gap:3px;justify-items:center;margin-top:2px}
.boss.on{display:grid}
.boss span{font-size:13px;letter-spacing:.3em;color:var(--lantern);text-shadow:0 0 8px rgba(255,179,90,.6)}
.boss .hp{width:min(80vw,360px);height:9px}
.boss .hp i{background:linear-gradient(90deg,#d2691e,#ffcf7a)}

/* overlays */
.ov{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(3,8,9,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{display:grid}
.box{width:min(100%,420px);display:grid;gap:12px;justify-items:center;text-align:center}
h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(46px,14vw,74px);line-height:1.05;color:#eef6ea;text-shadow:0 0 18px rgba(127,227,198,.5),0 3px 0 #071010}
h1 .zhan{color:var(--cinnabar);text-shadow:0 0 18px rgba(229,72,58,.55),0 3px 0 #2a0906}
h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.2em}
.sub{font-size:14px;letter-spacing:.3em;color:var(--dim)}
.txt{font-size:14px;line-height:1.7;color:var(--ink);opacity:.9}
.btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:48px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);font-size:17px;letter-spacing:.18em;color:var(--ink)}
.btn.go{border-color:var(--jade);background:linear-gradient(180deg,rgba(127,227,198,.3),rgba(127,227,198,.08));color:#fff}
.btn small{display:block;font-size:12px;letter-spacing:.1em;color:var(--dim);margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.btn[aria-pressed="true"]{border-color:var(--jade);color:var(--jade);background:rgba(127,227,198,.12)}
.stat{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px;justify-content:center}
.stat dt{color:var(--dim);text-align:right}.stat dd{margin:0;text-align:left;color:#fff4d6}
.realm{width:100%;display:grid;gap:4px;font-size:13px;color:var(--dim)}
.realm .wu{height:8px}

.cards{display:grid;gap:10px;width:100%}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;text-align:left;padding:12px 14px;
  border-radius:14px;border:1px solid var(--line);background:var(--panel);animation:flip .35s ease-out backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes flip{from{transform:rotateY(80deg) scale(.9);opacity:0}}
.card .ic{grid-row:span 2;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(127,227,198,.1);color:var(--jade)}
.card b{font-size:17px;letter-spacing:.08em}.card span{font-size:13px;color:var(--dim);line-height:1.5}
.card em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.card.r1{border-color:var(--violet);box-shadow:0 0 16px rgba(184,146,255,.25)}.card.r1 .ic{color:var(--violet);background:rgba(184,146,255,.12)}.card.r1 em{color:var(--violet)}
.card.r2{border-color:var(--gold);box-shadow:0 0 20px rgba(242,199,92,.35)}.card.r2 .ic{color:var(--gold);background:rgba(242,199,92,.12)}.card.r2 em{color:var(--gold)}
.card.r0 em{color:var(--dim)}

.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s}
.banner.on{opacity:1;transform:none}
.banner b{display:inline-block;padding:10px 22px;border-radius:12px;background:rgba(20,6,4,.75);border:1px solid var(--cinnabar);font-size:20px;letter-spacing:.12em;color:#ffd9c2;
  text-shadow:0 0 10px rgba(229,72,58,.7)}
.banner small{display:block;font-size:13px;color:var(--lantern);letter-spacing:.3em;margin-bottom:4px}
.bubble{position:fixed;left:0;top:0;max-width:220px;padding:7px 11px;border-radius:12px;background:rgba(255,236,206,.94);color:#3a200c;font-size:14px;line-height:1.45;
  pointer-events:none;opacity:0;transition:opacity .3s;transform:translate(-50%,-100%)}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(255,236,206,.94)}
</style>

<canvas id="c" aria-label="白石村的夜晚，拖曳畫面移動"></canvas>
<div class="vig"></div>
<div class="hurt" id="hurt"></div>

<div class="hud" id="hud" hidden>

  <div class="row2">
    <div class="power">戰力<b id="power">0</b><div class="hp" aria-label="生命"><i id="hp"></i></div></div>
    <div class="kills">斬妖 <b id="kills">0</b><br><span class="tag" id="buffs"></span></div>
  </div>
  <div class="boss" id="bossBox"><span id="bossName">燈籠大王</span><div class="hp"><i id="bossHp"></i></div></div>
</div>
<div class="banner" id="banner"><b><small id="bannerSmall"></small><span id="bannerText"></span></b></div>
<div class="bubble" id="bubble"></div>

<div class="ov on" id="startOv">
  <div class="box">
    <h1>午夜來<span class="zhan">斬</span>妖</h1>
    <div class="sub">序章・雞不啼的村子</div>
    <div class="txt">子時一到，白石村的燈籠全滅了，連公雞都不啼。<br>提著燈燈下山斬妖，撐到雞啼天亮！</div>
    <div class="pair" role="group" aria-label="角色"><button class="btn" data-who="0">女主角</button><button class="btn" data-who="1">男主角</button></div>
    <button class="btn go" id="startNight">開始・一夜<small>8 分鐘，第 4 分鐘精英、接近天亮燈籠大王</small></button>
    <button class="btn" id="startQuick">快速試玩<small>2 分半，測手感用</small></button>
    <div class="realm"><span id="realmText">煉氣一層・修為 0</span><div class="wu"><i id="realmBar"></i></div></div>
    <div class="tag">拖曳畫面走路，放開就站樁；飛劍會自己斬妖</div>
  </div>
</div>

<div class="ov" id="cardOv">
  <div class="box">
    <h2>頓悟</h2>
    <div class="sub">三選一，只在這一夜有效</div>
    <div class="cards" id="cards"></div>
    <button class="btn" id="skipCard">不要</button>
  </div>
</div>

<div class="ov" id="pauseOv">
  <div class="box">
    <h2>暫停</h2>
    <div class="txt" id="pauseInfo"></div>
    <button class="btn go" id="resume">繼續斬妖</button>
    <button class="btn" id="giveUp">放棄這一夜</button>
  </div>
</div>

<div class="ov" id="endOv">
  <div class="box">
    <h2 id="endTitle">雞啼了，天亮了！</h2>
    <div class="txt" id="endText"></div>
    <dl class="stat" id="endStat"></dl>
    <div class="realm"><span id="realmText2"></span><div class="wu"><i id="realmBar2"></i></div></div>
    <button class="btn go" id="again">再一夜</button>
    <button class="btn" id="toTitle">回標題</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#c');
const isTouch=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
const LC=c=>new THREE.Color(c).convertSRGBToLinear();
/*@include hero_core.js*/

/* ================= 序章・白石村 ================= */
scene.fog.density=.034;
const DAWN_FOG=LC(0x6f7f8c),NIGHT_FOG=FOG.clone();
const groundTex=ctex(512,512,(x,w,h)=>{x.fillStyle='#1d221d';x.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){const r=8+rnd()*42;x.fillStyle=`rgba(${rnd()<.5?'10,14,11':'52,56,46'},${.08+rnd()*.12})`;x.beginPath();x.arc(rnd()*w,rnd()*h,r,0,7);x.fill()}
  x.strokeStyle='rgba(80,96,70,.28)';x.lineWidth=1.3;for(let i=0;i<600;i++){const px=rnd()*w,py=rnd()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+(rnd()-.5)*5,py-3-rnd()*6);x.stroke()}});
groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;groundTex.repeat.set(22,22);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({map:groundTex}));ground.rotation.x=-Math.PI/2;scene.add(ground);
// stone-paved square in the middle of the village
const paveTex=ctex(256,256,(x,w,h)=>{x.fillStyle='#2f322e';x.fillRect(0,0,w,h);// worn flagstones: uneven sizes, moss, dark joints
  for(let r=0;r<6;r++){let cx=-(rnd()*30);const hh=256/6;while(cx<w){const ww=30+rnd()*34,t=(rnd()-.5)*14;x.fillStyle=`rgb(${58+t},${61+t},${56+t})`;x.fillRect(cx+2,r*hh+2,ww-4,hh-4);cx+=ww}}
  for(let i=0;i<220;i++){x.fillStyle=`rgba(${rnd()<.6?'38,58,40':'20,22,20'},${.12+rnd()*.2})`;x.beginPath();x.arc(rnd()*w,rnd()*h,2+rnd()*9,0,7);x.fill()}});
paveTex.wrapS=paveTex.wrapT=THREE.RepeatWrapping;paveTex.repeat.set(4,4);
const pave=new THREE.Mesh(new THREE.CircleGeometry(9,48),new THREE.MeshLambertMaterial({map:paveTex}));pave.rotation.x=-Math.PI/2;pave.position.y=.01;scene.add(pave);

const wallM=toon(0xd6d0c2,{roughness:.9}),roofM=toon(0x262a31,{roughness:.7}),baseM=toon(0x5b5f58),doorM=toon(0x3a2a20),winM=toon(0x2a2416,{emissive:0x3a2a0c});
const poleM=toon(0x2b211b),deadLanM=toon(0x5a1c18,{roughness:.6}),stoneM=toon(0x6a6e68),treeM=toon(0x1c2420);
function house(x,z,rot,w,d){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  const h=1.5+rnd()*.5;
  part(new THREE.BoxGeometry(w+.1,.25,d+.1),baseM,g,{p:[0,.12,0]});
  part(new THREE.BoxGeometry(w,h,d),wallM,g,{p:[0,h/2+.2,0]});
  const rw=d/2+.45,ang=.5;// two roof slopes meeting at the ridge, with eaves
  [-1,1].forEach(s=>part(new THREE.BoxGeometry(w+.7,.08,rw/Math.cos(ang)),roofM,g,{p:[0,h+.2+Math.tan(ang)*rw/2,s*rw/2],r:[s*ang,0,0]}));
  part(new THREE.BoxGeometry(w+.8,.12,.14),roofM,g,{p:[0,h+.2+Math.tan(ang)*rw+.02,0]});
  part(new THREE.BoxGeometry(.7,1.1,.06),doorM,g,{p:[0,.75,d/2+.01]});
  [-1,1].forEach(s=>{if(w>2.4)part(new THREE.BoxGeometry(.5,.45,.05),rnd()<.3?winM:doorM,g,{p:[s*(w/2-.6),1.15,d/2+.01]})})}
function deadLantern(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  part(new THREE.CylinderGeometry(.04,.05,2.2,6),poleM,g,{p:[0,1.1,0]});part(new THREE.BoxGeometry(.6,.05,.05),poleM,g,{p:[.25,2.1,0]});
  part(new THREE.SphereGeometry(.17,12,10),deadLanM,g,{p:[.5,1.85,0],s:[1,1.2,1]});return g}
function bareTree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);g.rotation.y=rnd()*6;scene.add(g);
  part(new THREE.CylinderGeometry(.08,.2,2.8,7),treeM,g,{p:[0,1.4,0]});
  for(let i=0;i<5;i++){const b=part(new THREE.CylinderGeometry(.02,.07,1.2+rnd()*.7,5),treeM,g,{p:[0,1.6+i*.3,0]});b.rotation.set(.6+rnd()*.5,i*1.3,0);b.translateY(.45)}}
// houses on a ring around the square, doors facing in
const HOUSES=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2+(rnd()-.5)*.15,r=14+rnd()*5,w=2.4+rnd()*1.6,d=2+rnd()*.8;
  house(Math.sin(a)*r,Math.cos(a)*r,a+Math.PI,w,d);HOUSES.push({x:Math.sin(a)*r,z:Math.cos(a)*r,r:Math.max(w,d)*.55})}
for(let i=0;i<8;i++){const a=i/8*Math.PI*2+.2;deadLantern(Math.sin(a)*9.6,Math.cos(a)*9.6)}
for(let i=0;i<9;i++){const a=rnd()*Math.PI*2,r=21+rnd()*8;bareTree(Math.sin(a)*r,Math.cos(a)*r,.9+rnd()*.5)}
// the village well
{const g=new THREE.Group();g.position.set(3.2,0,-2.4);scene.add(g);
 part(new THREE.CylinderGeometry(.62,.68,.55,18,1,true),stoneM,g,{p:[0,.27,0]});part(new THREE.TorusGeometry(.64,.07,8,24),stoneM,g,{p:[0,.55,0],r:[Math.PI/2,0,0]});
 part(new THREE.CircleGeometry(.6,18),toon(0x050807),g,{p:[0,.4,0],r:[-Math.PI/2,0,0]});
 [-1,1].forEach(s=>part(new THREE.BoxGeometry(.08,1.3,.08),poleM,g,{p:[s*.62,.9,0]}));part(new THREE.BoxGeometry(1.4,.08,.08),poleM,g,{p:[0,1.52,0]});HOUSES.push({x:3.2,z:-2.4,r:.8})}
const moonTex=ctex(256,256,(x,w,h)=>{const g=x.createRadialGradient(128,128,40,128,128,128);g.addColorStop(0,'#f4f0dc');g.addColorStop(.62,'#e6e3cc');g.addColorStop(.66,'rgba(230,227,204,0)');x.fillStyle=g;x.fillRect(0,0,w,h)});
const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex,fog:false,depthWrite:false}));moon.scale.set(10,10,1);moon.position.set(-30,30,-50);scene.add(moon);
const fogTex=ctex(256,256,(x,w,h)=>{for(let i=0;i<40;i++){const px=40+rnd()*176,py=40+rnd()*176,r=30+rnd()*50;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'rgba(190,215,205,.18)');g.addColorStop(1,'rgba(190,215,205,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}});
const fogs=[];for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(22,22),new THREE.MeshBasicMaterial({map:fogTex,transparent:true,depthWrite:false,opacity:.2}));
  m.rotation.x=-Math.PI/2;m.position.set((rnd()-.5)*30,.05+i*.03,(rnd()-.5)*30);m.userData.s=(rnd()-.5)*.04;scene.add(m);fogs.push(m)}
const ARENA=22;// the hero stays inside this radius

/* ================= 共用小工具 ================= */
// merge simple coloured parts into one geometry (for InstancedMesh enemies)
function merged(parts){const pos=[],nor=[],col=[];const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),c=new THREE.Color();
  for(const p of parts){const g=p.g.index?p.g.toNonIndexed():p.g.clone();e.set(...(p.r||[0,0,0]));q.setFromEuler(e);
    m.compose(new THREE.Vector3(...(p.p||[0,0,0])),q,new THREE.Vector3(...(p.s||[1,1,1])));g.applyMatrix4(m);c.copy(LC(p.c));
    const a=g.attributes.position.array,n=g.attributes.normal.array;for(let i=0;i<a.length;i++){pos.push(a[i]);nor.push(n[i])}
    for(let i=0;i<a.length/3;i++)col.push(c.r,c.g,c.b)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return g}
const S0=new THREE.SphereGeometry(1,14,10),B0=new THREE.BoxGeometry(1,1,1),C0=new THREE.CylinderGeometry(1,1,1,12);
const ghostGeo=(()=>{const pts=[[0,.95],[.18,.9],[.3,.75],[.34,.55],[.3,.35],[.2,.2],[.08,.08],[0,0]].map(p=>new THREE.Vector2(p[0],p[1]));
  return merged([{g:new THREE.LatheGeometry(pts,16),c:'#cdf3ea'},{g:S0,c:'#0b1414',p:[-.1,.7,.27],s:[.055,.08,.04]},{g:S0,c:'#0b1414',p:[.1,.7,.27],s:[.055,.08,.04]},
